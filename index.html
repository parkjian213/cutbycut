/* 레이아웃(3.2): 연회색 바탕 위 흰 둥근 카드. 씬은 색 점이 붙은 제목, 컷은 왼쪽 샷 사이즈 배지와 설명. */
:root{
  --paper:#F2F3F5;--card:#FFFFFF;--raise:#FFFFFF;--ink:#191F28;--muted:#5F6B78;--line:#E5E8EB;
  --tape:#191F28;--tape-fg:#FFFFFF;--tally:#E03131;--tally-fg:#FFFFFF;--ok:#0E7C58;--ok-fg:#FFFFFF;--keep:#B54708;--keep-fg:#FFFFFF;--soft:#F2F3F5;
  --acc:#3B5BDB;--acc-fg:#FFFFFF;--acc-soft:#EDF2FF;--acc-ink:#364FC7;--warm-soft:#FFF4E6;--warm-ink:#B54708;--ok-soft:#E6F6EE;--ok-ink:#0B6B4C;
  --s-di:#FFFFFF;--s-di-fg:#17222C;--s-de:#F4D230;--s-de-fg:#17222C;--s-ni:#2F67B8;--s-ni-fg:#FFFFFF;--s-ne:#1F8A5B;--s-ne-fg:#FFFFFF;--s-m:#F3B0C0;--s-m-fg:#17222C;--s-e:#EE9A3C;--s-e-fg:#17222C;
  --code:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101114;--card:#1B1D22;--raise:#23262C;--ink:#ECEDEF;--muted:#9AA0A8;--line:#2C3036;
  --tape:#ECEDEF;--tape-fg:#101114;--tally:#FF6B6B;--tally-fg:#101114;--ok:#3CC796;--ok-fg:#08261B;--keep:#FFB86B;--keep-fg:#2B1D00;--soft:#23262C;
  --acc:#7C93FF;--acc-fg:#0E1330;--acc-soft:#232B45;--acc-ink:#AFC0FF;--warm-soft:#3A2A16;--warm-ink:#FFB86B;--ok-soft:#173226;--ok-ink:#6EE0B0;
  --s-di:#DDE2E2;--s-di-fg:#10171E;--s-de:#D9BA2A;--s-de-fg:#10171E;--s-ni:#4C84D6;--s-ni-fg:#08131F;--s-ne:#38AD7B;--s-ne-fg:#06170F;--s-m:#E5A1B2;--s-m-fg:#10171E;--s-e:#E39238;--s-e-fg:#10171E;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101114;--card:#1B1D22;--raise:#23262C;--ink:#ECEDEF;--muted:#9AA0A8;--line:#2C3036;
  --tape:#ECEDEF;--tape-fg:#101114;--tally:#FF6B6B;--tally-fg:#101114;--ok:#3CC796;--ok-fg:#08261B;--keep:#FFB86B;--keep-fg:#2B1D00;--soft:#23262C;
  --acc:#7C93FF;--acc-fg:#0E1330;--acc-soft:#232B45;--acc-ink:#AFC0FF;--warm-soft:#3A2A16;--warm-ink:#FFB86B;--ok-soft:#173226;--ok-ink:#6EE0B0;
  --s-di:#DDE2E2;--s-di-fg:#10171E;--s-de:#D9BA2A;--s-de-fg:#10171E;--s-ni:#4C84D6;--s-ni-fg:#08131F;--s-ne:#38AD7B;--s-ne-fg:#06170F;--s-m:#E5A1B2;--s-m-fg:#10171E;--s-e:#E39238;--s-e-fg:#10171E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body);overflow-x:hidden;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--s-ni);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px;padding-block:6px}
.top h1{font-size:17px;font-weight:700;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;flex:none}
.icon:hover{background:var(--soft)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.code{font-family:var(--code);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 카메라 테이프 */
.tape{display:inline-flex;align-items:center;justify-content:center;background:var(--tape);color:var(--tape-fg);font:700 17px/1 var(--code);letter-spacing:.03em;padding:4px 9px 4px;min-width:42px;white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 3px) 20%,100% 40%,calc(100% - 3px) 60%,100% 80%,calc(100% - 3px) 100%,0 100%,3px 80%,0 60%,3px 40%,0 20%)}
.tape.empty{background:var(--soft);color:var(--muted)}
.tape.term{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);clip-path:none;border-radius:2px;font-size:14px;padding:3px 6px;min-width:0}
/* 진행 막대: 컷 하나가 칸 하나 */
.bar{display:flex;gap:2px;height:10px}
.bar i{flex:1 1 0;min-width:1px;background:var(--line)}
.bar i.done{background:var(--ok)}.bar i.skip{background:var(--muted);opacity:.45}.bar i.now{background:var(--tally)}
.prog{padding-block:0 10px;display:grid;gap:6px}
.prog-t{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.prog-t b{color:var(--ink);font-weight:700}
main{padding-block:14px 110px}
/* 홈 */
.home-head{padding-block:26px 18px}
.home-head h2{font:700 54px/.95 var(--code);letter-spacing:.005em}
.home-head p{color:var(--muted);margin-top:8px;max-width:34em}
.plist{display:grid;gap:10px}
.pwrap{position:relative}
.pdel{position:absolute;top:6px;right:6px;color:var(--muted);z-index:1}
.pdel:hover{color:var(--tally)}
.pitem h3{padding-right:40px}
.pitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:14px 14px 12px}
.pitem:hover{border-color:var(--ink)}
.pitem h3{font-size:17px;font-weight:700;line-height:1.3}
.pmeta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.strips{display:flex;gap:2px;height:8px;margin-bottom:8px}
.strips i{flex:1 1 0;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:9px 15px;border:1.5px solid var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;background:transparent}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--ink);opacity:.9}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--tally);color:var(--tally)}
.btn.grow{flex:1 1 0}
.sync{font-size:13px;color:var(--muted);margin-top:18px}
/* 스트립보드 */
.scene{margin-bottom:18px}
.strip{display:flex;align-items:stretch;background:var(--sbg);color:var(--sfg);box-shadow:inset 0 0 0 1px rgba(23,34,44,.28)}
.strip-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:7px 4px 7px 12px;min-height:48px;color:inherit}
.strip-no{font:700 26px/1 var(--code);flex:none}
.strip-tt{min-width:0;line-height:1.3}
.strip-tt b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-tt span{font:600 15px/1.1 var(--code);letter-spacing:.03em}
.strip-add{flex:none;font-weight:700;padding:0 13px;min-width:48px;font-size:14px;color:inherit;border-left:1px solid rgba(23,34,44,.28)}
.cuts{background:var(--card);border:1px solid var(--line);border-top:0;min-height:12px}
.cut{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--card);position:relative}
.cut:first-child{border-top:0}
.drop-line{height:4px;background:var(--tally);margin-block:-2px;position:relative;z-index:4}
.cut.dragging{z-index:5;opacity:.92;box-shadow:0 8px 22px rgba(0,0,0,.28);background:var(--raise)}
.cut.is-done .cut-main{opacity:.62}
.cut.is-skip .cut-main{opacity:.45}
.cut.is-skip .cut-desc{text-decoration:line-through}
.cut-main{flex:1;min-width:0;text-align:left;padding:10px 4px 10px 12px;display:grid;gap:5px}
.cut-l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cut-no{font:700 21px/1 var(--code);min-width:32px;font-variant-numeric:tabular-nums}
.cut-spec{font-size:13.5px;font-weight:500}
.cut-desc{font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.cut-desc.none{color:var(--muted)}
.cut-note{font-size:12.5px;color:var(--muted)}
.mark{font-size:12px;font-weight:700;padding:1px 6px;border-radius:2px}
.mark.opt{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.mark.ok{background:var(--ok);color:var(--ok-fg)}
.mark.skip{background:var(--muted);color:var(--card)}
.star{color:var(--keep);font-size:16px;line-height:1}

<script>
"use strict";
const BUILD="web";
const VIEW_MODE=BUILD==="web"&&/^#view=/.test(location.hash);
const APP_VER="3.8";
const CHANGELOG=[
 ["3.8",["씬마다 배치도 그림을 넣을 수 있어요. Shot Designer 같은 앱에서 저장한 이미지를 붙이면 샷리스트, 촬영 화면, 공유 화면, 출력에 같이 나와요.","다른 앱 샷리스트(CSV, TSV, 텍스트)를 불러올 수 있어요. 홈의 '백업·샷리스트 불러오기'에서 골라요."]],
 ["3.7",["뷰파인더 모드를 넣었어요. 폰 카메라에 화면비 틀과 렌즈 화각을 겹쳐 보고, 그 틀대로 찍으면 콘티로 저장돼요.","컷마다 카메라 세팅(ISO, 셔터, 조리개, 화이트밸런스, ND)을 적을 수 있어요. 새 컷은 앞 컷 세팅을 이어받아요."]],
 ["3.6",["콜시트에 하루 타임라인을 넣었어요. 골든아워, 블루아워, 시간별 비 확률, 촬영 씬이 한 줄에 보여요.","해가 안 맞거나 비 올 확률이 높은 시간에 잡힌 야외 씬을 알려 줘요.","배치도에서 카메라 센서(풀프레임, 슈퍼35, 마이크로포서드)를 고를 수 있고, 화각 각도도 보여요.","콘티에 화살표 도구를 넣었어요.","스태프 공유 화면이 1분마다 알아서 새로고침돼요.","두 기기에서 같은 작품을 따로 고쳐도 컷 단위로 합쳐져요."]],
 ["3.5",["앱 아이콘을 렌즈 디자인으로 바꿨어요."]],
 ["3.4",["첫 화면 큰 '컷바이컷' 제목을 지웠어요."]],
 ["3.3",["첫 화면 설명 문구를 지웠어요."]],
 ["3.2",["새 디자인: 연회색 바탕에 흰 둥근 카드, 진행률 원, 전환 버튼으로 화면 전체를 정돈했어요.","컷 목록이 왼쪽 샷 사이즈 배지, 가운데 설명, 아래 정보 순서로 바뀌었어요."]],
 ["3.1",["날씨를 더 정확하게: 촬영 장소를 이름으로 찾아 그 자리 예보를 받아요.","집합 시간부터 1시간 단위 예보와 비 양(mm)을 보여 줘요.","예보 기준 시각과 며칠 뒤 예보인지에 따른 믿을 정도를 알려 줘요.","네이버 날씨로 바로 비교해 볼 수 있어요."]],
 ["3.0",["컷 편집 화면을 정리했어요. 설명 칸이 맨 위로 왔고, 자주 안 쓰는 칸은 '자세히'로 접혀요.","⋯ 메뉴를 보내기, 작품, 앱 설정으로 나눴어요.","배치도 아이콘과 글자를 키우고 버튼을 한 줄로 정리했어요.","씬 정보 창을 짧게 정리했어요.","예시 작품은 고쳐도 다른 기기로 넘어가지 않고, 내 작품으로 복사할 수 있어요.","콜시트에 촬영일 날씨 예보(설치한 앱에서)와 장비 체크리스트를 넣었어요.","샷리스트에서 컷을 검색할 수 있어요.","컷 번호를 1A처럼 직접 붙일 수 있어요.","지운 씬과 컷도 30일 동안 되살릴 수 있어요."]],
 ["2.9",["예상 시간, FPS, 촬영 회차, 렌즈를 숫자로 직접 넣을 수 있어요.","내 선택지 고치기: NG 이유, 예상 시간 버튼, FPS, 배치도 렌즈와 조명 이름을 내 마음대로 바꿔요.","내 컷 세트: 지금 씬의 컷 구성을 세트로 저장해 다른 씬에 넣어요.","내 용어: 용어 사전과 컷 선택에 내 용어를 추가해요.","콜시트에서 씬별 시작 시각을 직접 바꿀 수 있어요.","내 설정도 기기 연동으로 컴퓨터와 폰에 맞춰져요."]],
 ["2.8",["콜시트: 회차별 집합 시간, 장소, 촬영 순서와 예상 시간, 출연, 소품을 한 장으로 만들고 복사해요.","배치도: 씬마다 위에서 본 평면도에 인물, 카메라, 조명, 사물, 180도 선을 놓아요.","해 시간: 촬영일과 지역으로 일출, 일몰, 골든아워, 블루아워를 알려 줘요. 인터넷 없이도 계산돼요.","스태프 공유: 감독, 스태프가 볼 수만 있는 링크를 보내요.","용어 사전에 현장·실무 용어를 크게 늘렸어요."]],
 ["2.7",["첫 화면 작품 카드에 삭제 버튼을 넣었어요.","휴지통: 지운 작품을 30일 동안 보관하고 언제든 되살릴 수 있어요.","작품 안 오른쪽 위 메뉴 아이콘을 점 세 개(⋯)로 바꿨어요."]],
 ["2.6",["업데이트 내역을 앱 버전 아래에서 볼 수 있게 했어요."]],
 ["2.5",["와이파이나 데이터가 없어도 앱이 열리고 모든 기능을 쓸 수 있어요.","인터넷이 다시 연결되면 그동안 바꾼 작품이 자동으로 맞춰져요.","인터넷 없을 때 지운 작품이 다시 살아나던 문제를 고쳤어요.","신호가 약해도 3초 안에 앱이 열려요."]],
 ["2.4",["기기 연동: 컴퓨터와 폰의 작품이 GitHub를 통해 자동으로 맞춰져요."]],
 ["2.3",["용어 사실 확인: (E)와 OFF, 초커, 정지 화면, 매직아워 설명을 바로잡았어요.","지어낸 약어를 실제 쓰는 이름으로 바꾸고 업샷(UP)을 넣었어요.","컷을 복제한 뒤 콘티를 지우면 원래 컷 콘티도 사라지던 문제를 고쳤어요.","랩 시각이 자정을 넘으면 시간이 틀리게 나오던 문제를 고쳤어요.","슬레이트 날짜가 오전 9시 전에 어제로 나오던 문제를 고쳤어요."]],
 ["2.2",["디자인 정리: 모서리를 둥글게, 테두리를 얇게 바꿨어요."]],
 ["2.1",["첫 화면에 앱 버전을 표시했어요."]],
 ["2.0",["콘티 그리기, 사진 넣기","디지털 슬레이트(클랩 소리와 화면 깜빡임)","시나리오 붙여넣기로 씬 나누기","컷 세트, 촬영 순서 자동 정렬, 랩 시각 알림, 촬영 회차","FPS, 테이크 메모, 편집용 테이크 기록, 밝게·어둡게 화면"]],
 ["1.0",["샷리스트, 촬영 모드(NG·KEEP·OK), 용어 사전, 인쇄·CSV·백업 내보내기"]]

const Sync={db:null,col:null,state:"local",timers:{},busy:{},pendingRemote:{}};
async function initSync(){
 if(!window.claude||typeof window.claude.use!=="function"){return}
 try{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  Sync.db=db;Sync.col=db.collection("data/users/"+id);Sync.state="syncing";refreshSync();
  Sync.col.onSnapshot(onRemote,()=>{Sync.state="local";Sync.col=null;refreshSync()});
 }catch(e){Sync.state="local";refreshSync()}
}
function onRemote(snap){
 const seen={},seenImg={};let seenPrefs=false;
 let changed=false;
 snap.docs.forEach(d=>{if(S.gone[d.id]){seen[d.id]=true;delRemote(d.id);return}const r=d.data();if(r&&r.kind==="prefs"){seenPrefs=true;const lc=PC();if((r.updatedAt||0)>(lc.updatedAt||0)&&r.data&&typeof r.data==="object"){S.prefs.c=r.data;PC();applyMyTerms();changed=true}else if((lc.updatedAt||0)>(r.updatedAt||0))pushPrefs();return}if(r&&r.kind==="img"){seenImg[d.id]=true;if(!IMG[d.id]&&typeof r.data==="string"){IMG[d.id]=r.data;idbPut(d.id,r.data);changed=true}return}if(!r||!r.id||!Array.isArray(r.scenes))return;seen[r.id]=true;const l=S.projects[r.id];
  if(!l||l.example||needMerge(l,r)||(r.updatedAt||0)>(l.updatedAt||0)){
    if(sheetStack.length&&View.pid===r.id){Sync.pendingRemote[r.id]=r}
    else if(applyRemote(r))changed=true
  }else if((l.updatedAt||0)>(r.updatedAt||0)){queueSync(l)}
  else if(!S.base[r.id])setBase(r)
  S.synced[r.id]=true});
 if(!snap.metadata.fromCache){
  if(!seenPrefs&&PC().updatedAt)pushPrefs();
  Object.keys(S.projects).forEach(id=>{const p=S.projects[id];if(seen[id]||p.example)return;
   if(S.synced[id]){if(!(Sync.timers[id]||Sync.busy[id])){delete S.projects[id];delete S.synced[id];delete S.base[id];changed=true}}else queueSync(p)});
  Object.values(S.projects).forEach(p=>{if(p.example)return;imgIds(p).forEach(i=>{if(IMG[i]&&!seenImg[i])pushImg(i)})});
  Sync.state="on";
 }
 saveLocal();refreshSync();
 if(changed&&!sheetStack.length)render();
}

function mergeList(bl,ll,rl,item){
 bl=bl||[];const M=a=>Object.fromEntries(a.map(x=>[x.id,x]));const B=M(bl),L=M(ll),R=M(rl);
 const pick=id=>{const b=B[id],l=L[id],r=R[id];if(l&&r)return item(b,l,r);if(l)return !b?l:jeq(l,b)?null:l;if(r)return !b?r:jeq(r,b)?null:r;return null};
 const ids=a=>a.map(x=>x.id),common=(a,c)=>a.filter(i=>c.includes(i));
 const lMoved=!jeq(common(ids(ll),ids(bl)),common(ids(bl),ids(ll))),rMoved=!jeq(common(ids(rl),ids(bl)),common(ids(bl),ids(rl)));

function mergeScene(b,l,r){const o=mergeFields(b,l,r,["cuts"]);o.cuts=mergeList(b&&b.cuts,l.cuts||[],r.cuts||[],mergeCut);return o}
function merge3(b,l,r){const o=mergeFields(b,l,r,["scenes","calls","updatedAt"]);o.scenes=mergeList(b.scenes,l.scenes||[],r.scenes||[],mergeScene);const bc=b.calls||{},lc=l.calls||{},rc=r.calls||{};o.calls={};new Set([...Object.keys(lc),...Object.keys(rc)]).forEach(d=>{o.calls[d]=lc[d]&&rc[d]?mergeFields(bc[d],lc[d],rc[d]):(lc[d]||rc[d])});return o}
function applyRemote(r){
 const l=S.projects[r.id];
 if(needMerge(l,r)){const m=normP(merge3(S.base[r.id],l,r));m.id=r.id;m.updatedAt=Math.max(l.updatedAt||0,r.updatedAt||0)+1;setBase(r);S.projects[r.id]=m;queueSync(m);toast(`"${m.name}"을 두 기기에서 고친 내용을 합쳤어요.`);return true}

}

async function pushP(id,retry){

  if(e&&e.code==="unavailable"&&!retry){Sync.busy[id]=false;setTimeout(()=>pushP(id,true),1200+Math.random()*800);return}

function queueHtml(p,l,curId){return `<div class="queue-t"><span>촬영 순서</span><button class="btn quiet" style="min-height:38px;padding:4px 10px;font-size:13px" data-act="order-sheet">순서 바꾸기</button></div><div class="queue">${l.map(x=>`<button class="qitem ${x.c.id===curId?"cur":""} ${x.c.status}" data-act="shoot-go" data-id="${x.c.id}" ${x.c.id===curId?'aria-current="true"':""}><span class="sw" style="${stripVars(x.sc)}"></span><span class="n">${esc(x.no)}</span><span class="tape" style="font-size:14px;min-width:36px">${esc(x.c.size||"미정")}</span><span class="d">${x.c.status==="done"?"OK ":""}${esc(x.c.desc||specLine(x.c))}</span></button>`).join("")}</div>`}

const sheetStack=[];
function openSheet(title,bodyHtml,footHtml,opts={}){
 const wrap=document.createElement("div");wrap.className="sheet-wrap";
 const labelId="s"+uid();
 wrap.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${labelId}" tabindex="-1"><div class="sheet-head"><h2 id="${labelId}">${esc(title)}</h2>${opts.headExtra||""}<button class="icon" data-act="close-sheet" aria-label="닫기">${ICON.close}</button></div><div class="sheet-body">${bodyHtml}</div>${footHtml?`<div class="sheet-foot">${footHtml}</div>`:""}</div>`;
 const rec={wrap,onClose:opts.onClose,focus:document.activeElement};
 wrap.addEventListener("pointerdown",e=>{rec.bgDown=e.target===wrap});
 wrap.addEventListener("click",e=>{if(e.target===wrap&&rec.bgDown)closeSheet()});
 $("#sheets").appendChild(wrap);sheetStack.push(rec);document.body.classList.add("locked");
 $(".sheet",wrap).focus({preventScroll:true});
 return wrap;
}
function closeSheet(){
 const rec=sheetStack.pop();if(!rec)return;
 rec.wrap.remove();
 if(rec.onClose)rec.onClose();
 if(!sheetStack.length){
  document.body.classList.remove("locked");
  Object.keys(Sync.pendingRemote).forEach(id=>{const r=Sync.pendingRemote[id],l=S.projects[id];if(!l||l.example||needMerge(l,r)||(r.updatedAt||0)>(l.updatedAt||0))applyRemote(r);delete Sync.pendingRemote[id]});saveLocal();
  render();
 }
 if(rec.focus&&document.contains(rec.focus))rec.focus.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetStack.length){e.preventDefault();closeSheet()}});

/* ───────── 끌어서 순서 바꾸기 (터치·마우스 공용) ─────────
   끄는 동안 항목을 DOM에서 옮기지 않는다. 옮기면 터치 포인터가 끊기는 브라우저가 있다. */
let dragJustEnded=false;

   const r=other.getBoundingClientRect();

/* ───────── 다른 앱 샷리스트 불러오기 (CSV, TSV, 텍스트) ───────── */
const normK=v=>String(v||"").toLowerCase().replace(/[^a-z0-9가-힣#]/g,"");
const SIZE_ALIAS={wide:"WS",wideshot:"WS",medium:"MS",mediumshot:"MS",mid:"MS",midshot:"MS",closeup:"CU",close:"CU",cu:"CU",mcu:"MCU",mediumcloseup:"MCU",ecu:"ECU",xcu:"ECU",extremecloseup:"ECU",insert:"INS",ins:"INS",overtheshoulder:"OTS",ots:"OTS",twoshot:"2S",two:"2S","2shot":"2S",full:"FS",fullshot:"FS",long:"LS",longshot:"LS",establishing:"EST",master:"MASTER",pov:"POV",cowboy:"MFS",mediumwide:"MWS",mws:"MWS"};

function termOf(cat,v){const k=normK(v);if(!k)return "";if(cat==="size"&&SIZE_ALIAS[k])return SIZE_ALIAS[k];if(cat==="move"&&MOVE_ALIAS[k]&&T.some(t=>t.cat==="move"&&t.code===MOVE_ALIAS[k]))return MOVE_ALIAS[k];const alt=x=>String(x||"").split(/[,/]/).map(normK);const t=T.find(t=>t.cat===cat&&(normK(t.code)===k||alt(t.ko).includes(k)||alt(t.en).includes(k)));return t?t.code:""}
function splitRows(txt){const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return [];const h=lines[0];const d=(h.match(/\t/g)||[]).length?"\t":(h.match(/,/g)||[]).length>=(h.match(/;/g)||[]).length?",":";";
 const out=[];let row=[],cell="",q=false;const t=txt.replace(/\r\n?/g,"\n");
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"'&&cell==="")q=true;else if(ch===d){row.push(cell);cell=""}else if(ch==="\n"){row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=""}else cell+=ch}
 row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out.map(r=>r.map(x=>x.trim()))}
const COLS=[["scene",/^(scene|sc|씬|s#|scene#|sceneno|scenenumber|씬번호)$/],["shot",/^(shot|shot#|shotno|shotnumber|cut|cut#|컷|컷번호|setup|no|#|번호)$/],["size",/(shotsize|size|shottype|type|framing|사이즈|샷사이즈|크기)/],["angle",/(angle|앵글|각도)/],["move",/(movement|move|cameramove|camera(motion|movement)|무빙|움직임)/],["lens",/(lens|focal|렌즈|화각)/],["desc",/(description|desc|action|subject|content|내용|설명|어떻게|장면)/],["note",/(note|notes|comment|memo|메모|비고)/],["loc",/(location|set|장소|로케)/],["ie",/^(intext|ie|i\/e|int|ext|실내외)$/],["dn",/^(daynight|dn|d\/n|time|낮밤|시간대)$/],["min",/(duration|dur|minutes|min|예상|소요|분)$/],["fps",/(fps|framerate|프레임)/],["cam",/^(camera|cam|카메라)$/]];

 const head=rows[0].map(normK);const map={};head.forEach((h,i)=>{for(const [k,re] of COLS){if(map[k]==null&&re.test(h)){map[k]=i;break}}});

  if(!hasHead){const line=r.join(" ").trim();const m=line.match(/^(?:S#?\s*)?(\d+[A-Za-z]?)\s*[-.]\s*(\d+[A-Za-z]?)\s+(.*)$/);if(m){scNo=m[1];shot=m[2];desc=m[3]}else desc=line}

  let lens=g("lens");if(/^\d+(\.\d+)?$/.test(lens))lens+="mm";

  const min=Math.round(parseFloat(g("min")));const fps=g("fps").replace(/[^\d.]/g,"");
  const c={size,angle:angle||"아이레벨",moves:moves.length?moves:["고정"],lens:lens.slice(0,20),desc:desc.slice(0,300),note:note.slice(0,200),min:min>=1&&min<=600?min:10,fps:+fps>0&&+fps<=2000?fps:""};

  if(c.desc||c.size||c.note){scenes[scNo].cuts.push(c);n++}});
 if(!n){toast("컷을 찾지 못했어요. 씬, 컷, 사이즈, 내용 같은 칸이 있는 CSV나 한 줄에 컷 하나씩 적힌 텍스트 파일을 골라 주세요.");return}

let VF=null;const VF_BASE=26;

const HEAD=/^\s*(?:s\s*#|scene|sc\.|씬|#)\s*(\d+[a-z0-9\-]*)[\s.:)\]\-–—]*(.*)$/i;
const SLUG=/^\s*((?:int|ext|i\/e)\b\.?|실내|실외)[\s.,:\-–—]*(.*)$/i;
function parseHeading(raw){
 const place=/\bext\b|실외|야외/i.test(raw)?"EXT":"INT";
 const time=/새벽|아침|오전|\bmorning\b|\bdawn\b|[(\s/,]M[)\s/,.]/i.test(" "+raw+" ")?"M":/밤|심야|\bnight\b|[(\s/,]N[)\s/,.]/i.test(" "+raw+" ")?"N":/저녁|노을|해질|황혼|\bevening\b|\bdusk\b|[(\s/,]E[)\s/,.]/.test(" "+raw+" ")?"E":"D";
 const loc=raw.replace(/\b(?:int|ext|i\/e)\b\.?/ig,"").replace(/(?:\b(?:day|night|morning|evening|dawn|dusk)\b)|실내|실외|야외/ig,"").replace(/[(\[][^)\]]*[)\]]/g,"").replace(/(^|[\s/,.\-–—])(?:[DNME]|낮|밤|새벽|아침|오전|오후|저녁|심야|노을)(?=$|[\s/,.\-–—])/g,"$1").replace(/[\s/,.\-–—:]+$/,"").replace(/^[\s/,.\-–—:]+/,"").replace(/\s{2,}/g," ").trim();
 return{place,time,loc:loc.slice(0,60)};
}
function parseScenario(text){
 const out=[];let c=null;let auto=0;
 String(text).split(/\r?\n/).forEach(l=>{
  let m=l.match(HEAD),no=null,rest="";
  if(m&&l.trim().length<80){no=m[1];rest=m[2]}
  else if((m=l.match(SLUG))&&l.trim().length<80){auto++;no=String(auto);rest=l}
  if(no!==null){c=Object.assign({no,body:""},parseHeading(rest));out.push(c)}
  else if(c)c.body+=l+"\n";
 });
 return out;
}

function autoOrder(p){
 const sizeRank={};T.filter(t=>t.cat==="size").forEach((t,i)=>{sizeRank[t.code]=i});

 const a=allCuts(p);const groups=[];
 a.forEach(x=>{const k=[x.sc.day||"1",x.sc.place,x.sc.time,x.sc.loc].join("|");let g=groups.find(y=>y.k===k);if(!g){g={k,day:+(x.sc.day||1),items:[]};groups.push(g)}g.items.push(x)});
 groups.sort((u,v)=>u.day-v.day);
 const order=[];
 a.filter(x=>x.c.status!=="todo").forEach(x=>order.push(x.c.id));
 groups.forEach(g=>{const todo=g.items.filter(x=>x.c.status==="todo");const lens={};todo.forEach(x=>{const r=rank(x.c),l=x.c.lens||"";lens[l]=Math.min(lens[l]??9999,r)});

 return order;
}

const GH={key:"cutbycut.link",api:"https://api.github.com",cfg:null,cb:null,timer:null,q:Promise.resolve(),lastWrite:0};
function ghLoad(){try{GH.cfg=JSON.parse(localStorage.getItem(GH.key)||"null")}catch(e){GH.cfg=null}}
function ghSave(){try{if(GH.cfg)localStorage.setItem(GH.key,JSON.stringify(GH.cfg));else localStorage.removeItem(GH.key)}catch(e){}}
async function ghFetch(path,opt={},token){
 const h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+(token||GH.cfg.token)};if(opt.body)h["Content-Type"]="application/json";
 const r=await fetch(GH.api+path,Object.assign({cache:"no-store"},opt,{headers:h}));
 if(r.status===401){const e=new Error("auth");e.code="auth";throw e}
 if(r.status===404||r.status===403){const e=new Error("http "+r.status);e.code="gone";throw e}
 if(!r.ok){const e=new Error("http "+r.status);e.code="net";throw e}
 return r.status===204?null:r.json();
}
async function ghFindOrCreate(token){
 for(let page=1;page<=5;page++){const l=await ghFetch(`/gists?per_page=100&page=${page}`,{},token);const g=l.find(x=>x.description==="cutbycut-sync");if(g)return g.id;if(l.length<100)break}
 const g=await ghFetch("/gists",{method:"POST",body:JSON.stringify({description:"cutbycut-sync",public:false,files:{"README.md":{content:"컷바이컷 기기 연동용 저장 공간이에요. 지우면 연동된 작품이 사라져요."}}})},token);

}
function ghPatch(files){const run=()=>ghFetch("/gists/"+GH.cfg.gist,{method:"PATCH",body:JSON.stringify({files})}).then(x=>{GH.lastWrite=Date.now();return x});const p=GH.q.then(run,run);GH.q=p.catch(()=>{});return p}

 await GH.q;
 try{
  const g=await ghFetch("/gists/"+GH.cfg.gist);const docs=[];
  for(const [name,f] of Object.entries(g.files||{})){
   if(!name.startsWith("cbc_"))continue;let txt=f.content;
   if(f.truncated){try{txt=await (await fetch(f.raw_url,{cache:"no-store"})).text()}catch(e){continue}}
   try{const d=JSON.parse(txt);docs.push({id:name.slice(4,-5),data:()=>d})}catch(e){}
  }

function sunTimes(dateStr,lat,lng){
 const R=Math.PI/180,[y,m,d]=dateStr.split("-").map(Number),day0=Date.UTC(y,m-1,d);
 const geo=ms=>{const jc=(ms/864e5+2440587.5-2451545)/36525;
  const L0=((280.46646+jc*(36000.76983+jc*0.0003032))%360+360)%360,M=357.52911+jc*(35999.05029-0.0001537*jc),e=0.016708634-jc*(0.000042037+0.0000001267*jc);
  const C=Math.sin(M*R)*(1.914602-jc*(0.004817+0.000014*jc))+Math.sin(2*M*R)*(0.019993-0.000101*jc)+Math.sin(3*M*R)*0.000289;
  const om=125.04-1934.136*jc,lam=L0+C-0.00569-0.00478*Math.sin(om*R);
  const eps=23+(26+(21.448-jc*(46.815+jc*(0.00059-jc*0.001813)))/60)/60+0.00256*Math.cos(om*R);
  const dec=Math.asin(Math.sin(eps*R)*Math.sin(lam*R)),yy=Math.tan(eps*R/2)**2;
  const eot=4/R*(yy*Math.sin(2*L0*R)-2*e*Math.sin(M*R)+4*e*yy*Math.sin(M*R)*Math.cos(2*L0*R)-0.5*yy*yy*Math.sin(4*L0*R)-1.25*e*e*Math.sin(2*M*R));
  return{dec,eot}};
 const ev=(zen,rise)=>{let t=day0+(720-4*lng)*6e4;for(let k=0;k<3;k++){const{dec,eot}=geo(t);const c=Math.cos(zen*R)/(Math.cos(lat*R)*Math.cos(dec))-Math.tan(lat*R)*Math.tan(dec);if(c<-1||c>1)return null;const ha=Math.acos(c)/R;t=day0+(720-4*(lng+(rise?ha:-ha))-eot)*6e4}return new Date(t)};
 const o={dawn:ev(96,1),rise:ev(90.833,1),goldAmEnd:ev(84,1),goldPmStart:ev(84,0),set:ev(90.833,0),dusk:ev(96,0)};
 return Object.values(o).every(Boolean)?o:null;
}
function sunHtml(c){

 const t=sunTimes(c.date,lat,lng);if(!t)return `<p class="scn-status">이 날짜와 위치에서는 해 시간을 계산할 수 없어요.</p>`;

 const ticks=[];for(let h=Math.ceil((a+60)/60);h*60<b;h+=3)ticks.push(`<span style="left:${X(h*60)}">${h}시</span>`);

const callDays=p=>{const d=[...new Set(p.scenes.map(s=>s.day||"1"))].sort((a,b)=>a-b);return d.length?d:["1"]};
function callOf(p,day){if(!p.calls||typeof p.calls!=="object")p.calls={};if(!p.calls[day])p.calls[day]={};return p.calls[day]}
function hm(str){const m=/^(\d{1,2}):(\d{2})/.exec(str||"");return m?+m[1]*60+ +m[2]:null}
const fmtHm=m=>`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function schedule(p,day){
 const c=callOf(p,day);let t=hm(c.start)??hm(c.call);const at=c.at&&typeof c.at==="object"?c.at:{};
 const order=[];shootList(p).filter(x=>(x.sc.day||"1")===day).forEach(x=>{let g=order.find(o=>o.sc===x.sc);if(!g){g={sc:x.sc,cuts:[]};order.push(g)}g.cuts.push(x.c)});
 p.scenes.filter(sc=>(sc.day||"1")===day&&!order.some(o=>o.sc===sc)).forEach(sc=>order.push({sc,cuts:[]}));
 return order.map(o=>{if(hm(at[o.sc.id])!=null)t=hm(at[o.sc.id]);const min=o.cuts.reduce((a,c)=>a+(+c.min||0),0);const row={sc:o.sc,n:o.cuts.length,min,from:t,to:t==null?null:t+min};if(t!=null)t+=min;return row});
}
function curDay(p){const ds=callDays(p);return ds.includes(View.callDay)?View.callDay:ds[0]}
function callHtml(p){
 const ds=callDays(p),day=curDay(p),c=callOf(p,day);
 const dateV=c.date||(day==="1"?p.date:"")||"";
 const rows=schedule(p,day);const total=rows.reduce((a,r)=>a+r.min,0);
 const cast=[...new Set(rows.flatMap(r=>(r.sc.cast||"").split(/[,，、]/).map(x=>x.trim()).filter(Boolean)))];
 const props=[...new Set(rows.flatMap(r=>(r.sc.props||"").split(/[,，、]/).map(x=>x.trim()).filter(Boolean)))];
 return `${ds.length>1?`<div class="filter" role="group" aria-label="회차">${ds.map(d=>`<button class="chip" data-act="call-day" data-d="${esc(d)}" aria-pressed="${d===day}">${esc(d)}회차</button>`).join("")}</div>`:""}
 <section class="csec"><h2>${esc(day)}회차 기본 정보</h2>
  <div class="two"><div class="field"><label for="cl-date">촬영일</label><input id="cl-date" class="input" type="date" data-call="date" value="${esc(dateV)}"></div><div class="field"><label for="cl-call">집합 시간</label><input id="cl-call" class="input" type="time" data-call="call" value="${esc(c.call||"")}"></div></div>
  <div class="two"><div class="field"><label for="cl-start">첫 촬영</label><input id="cl-start" class="input" type="time" data-call="start" value="${esc(c.start||"")}"></div><div class="field"><label for="cl-contact">연락처</label><input id="cl-contact" class="input" data-call="contact" inputmode="tel" placeholder="조감독 010-0000-0000" value="${esc(c.contact||"")}"></div></div>
  <div class="field"><label for="cl-place">집합 장소</label><input id="cl-place" class="input" data-call="place" placeholder="학교 정문 앞" value="${esc(c.place||"")}"></div>
  <div class="field"><label for="cl-note">공지</label><textarea id="cl-note" class="input" data-call="note" rows="2" placeholder="우천 시 실내 씬부터, 점심 12:30">${esc(c.note||"")}</textarea></div>
 </section>
 <section class="csec"><h2>해 시간</h2>
  <div class="row"><select id="cl-city" class="input" style="flex:1;min-width:0" aria-label="지역">${[`<option value="">지역 고르기</option>`,...CITIES.map(x=>`<option ${c.city===x[0]?"selected":""}>${x[0]}</option>`),c.city&&!CITIES.some(x=>x[0]===c.city)?`<option selected>${esc(c.city)}</option>`:""].join("")}</select><button class="btn" data-act="place-find">장소 검색</button><button class="btn" data-act="call-geo">현재 위치</button></div>
  <div id="sun-box">${sunHtml(Object.assign({},c,{date:dateV}))}</div>
  <div id="tl-box">${tlHtml(c,dateV)}</div>
  <div id="wx-box">${wxHtml(c,dateV)}</div>
 </section>
 <section class="csec"><h2>촬영 순서 ${rows.length?`(${minLabel(total)})`:""}</h2>
  ${rows.length?`<div class="sched">${rows.map(r=>`<div class="srow"><span class="sw" style="${stripVars(r.sc)}"></span><span class="t"><input class="tin" type="time" data-at="${r.sc.id}" value="${r.from!=null?fmtHm(r.from):""}" aria-label="S#${esc(r.sc.no)} 시작 시각"><small>${r.to!=null?"~"+fmtHm(r.to):""}${c.at&&c.at[r.sc.id]?" (직접)":""}</small></span><div style="min-width:0"><b>S#${esc(r.sc.no)} ${esc(r.sc.loc||"장소 미정")}</b><p>${r.sc.time} ${r.sc.place}, ${r.n}컷, ${minLabel(r.min)}${r.sc.cast?` · 출연 ${esc(r.sc.cast)}`:""}</p></div></div>`).join("")}</div><p class="scn-status">촬영 탭의 순서와 컷별 예상 시간으로 계산해요. 시각을 눌러 씬 시작을 직접 바꿀 수 있고, 지우면 자동 계산으로 돌아가요. ${hm(c.start)==null&&hm(c.call)==null?"첫 촬영이나 집합 시간을 넣으면 시각이 나와요.":""}</p>`:`<div class="blank"><h3>${esc(day)}회차에 씬이 없어요</h3><p>씬 정보에서 촬영 회차를 정해 주세요.</p></div>`}
 </section>
 ${gearHtml(c)}<section class="csec"><h2>출연과 준비물</h2><p>${cast.length?"출연: "+esc(cast.join(", ")):"출연을 적은 씬이 없어요. 씬 정보에서 적을 수 있어요."}</p><p>${props.length?"소품·의상: "+esc(props.join(", ")):""}</p></section>
 <div class="row"><button class="btn solid grow" data-act="call-copy">콜시트 복사 (카톡)</button></div>`;
}
function callText(p,day){
 const c=callOf(p,day),dateV=c.date||(day==="1"?p.date:"")||"";const rows=schedule(p,day);
 const out=[`[${p.name}] ${day}회차 콜시트`];
 if(dateV)out.push("날짜: "+dateV);if(c.call)out.push("집합: "+c.call+(c.place?" / "+c.place:""));else if(c.place)out.push("집합 장소: "+c.place);if(c.start)out.push("첫 촬영: "+c.start);if(c.contact)out.push("연락: "+c.contact);
 if(dateV&&c.lat){const t=sunTimes(dateV,+c.lat,+c.lng);if(t){const f=d=>clock(d.getTime());out.push(`해: 일출 ${f(t.rise)}, 일몰 ${f(t.set)}, 저녁 골든아워 ${f(t.goldPmStart)}~`)}}
 out.push("","촬영 순서");rows.forEach(r=>out.push(`${r.from!=null?fmtHm(r.from)+"~"+fmtHm(r.to)+" ":""}S#${r.sc.no} ${r.sc.time} ${r.sc.place} ${r.sc.loc||""} (${r.n}컷)${r.sc.cast?" 출연: "+r.sc.cast:""}${r.sc.props?" 준비: "+r.sc.props:""}`));
 const wk=wxKey(c,dateV);if(wk&&WX[wk]&&WX[wk].d){const d=WX[wk].d;out.push(`날씨: ${wmo(d.code)}, ${Math.round(d.min)}~${Math.round(d.max)}°C, 강수확률 ${d.rain??"-"}%, 바람 최대 ${Math.round(d.wind)}m/s`)}
 if(PC().gear.length)out.push("","챙길 장비: "+PC().gear.join(", "));
 if(c.note)out.push("","공지: "+c.note);
 return out.join("\n");
}

/* ───────── 배치도 ───────── */
const PW=100,PH=70;
function planOf(sc){if(!sc.plan||!Array.isArray(sc.plan.items))sc.plan={items:[],line:null};return sc.plan}
function lensMm(v){const m=/(\d+)/.exec(v||"");if(m)return+m[1];return /초광각/.test(v)?16:/광각/.test(v)?28:/망원/.test(v)?135:50}
const SENSORS=[["FF","풀프레임",36],["S35","슈퍼35",24.9],["MFT","마이크로포서드",17.3]];
function sensorW(k){const x=SENSORS.find(s=>s[0]===k);return x?x[2]:36}
function fovDeg(lens,sensor){const f=lensMm(lens||"50mm");return 2*Math.atan(sensorW(sensor)/2/f)*180/Math.PI}
function planSvg(plan,o={}){
 const P=o.print;const ink=P?"#17222C":"var(--ink)",mut=P?"#9AA4AA":"var(--line)",red=P?"#CF1F2E":"var(--tally)",amb=P?"#A86A00":"var(--keep)",blu=P?"#2F67B8":"var(--s-ni)",bg=P?"#fff":"var(--raise)",soft=P?"#E3E7E6":"var(--soft)";
 let g=`<rect x="0" y="0" width="${PW}" height="${PH}" fill="${bg}"/><g pointer-events="none">`;
 for(let x=10;x<PW;x+=10)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${PH}" stroke="${mut}" stroke-width=".15"/>`;for(let y=10;y<PH;y+=10)g+=`<line x1="0" y1="${y}" x2="${PW}" y2="${y}" stroke="${mut}" stroke-width=".15"/>`;g+=`</g>`;
 const L=plan.line;if(L){g+=`<line x1="${L.x1}" y1="${L.y1}" x2="${L.x2}" y2="${L.y2}" stroke="${red}" stroke-width=".6" stroke-dasharray="2 1.4"/><text x="${(L.x1+L.x2)/2}" y="${(L.y1+L.y2)/2-1.6}" font-size="2.6" fill="${red}" text-anchor="middle" font-weight="700">180°</text>`;if(o.edit)g+=`<circle data-h="1" cx="${L.x1}" cy="${L.y1}" r="2.4" fill="${red}" opacity=".8"/><circle data-h="2" cx="${L.x2}" cy="${L.y2}" r="2.4" fill="${red}" opacity=".8"/>`}
 const cone=(deg,len,col,op)=>{const a=deg/2*Math.PI/180,w=Math.tan(a)*len;return `<path d="M0 0L${-w} ${-len}L${w} ${-len}Z" fill="${col}" opacity="${op}" pointer-events="none"/>`};
 const items=[...plan.items].sort((a,b)=>(a.t==="o"?0:1)-(b.t==="o"?0:1));
 items.forEach(it=>{
  let body="";
  if(it.t==="p")body=`<circle r="4.2" fill="${blu}"/><path d="M-2.2 -3.6L0 -6.8L2.2 -3.6Z" fill="${blu}"/>`;
  else if(it.t==="c"){body=cone(fovDeg(it.lens,plan.sensor),30,red,.13)+`<rect x="-3.4" y="-2.3" width="6.8" height="4.6" rx=".8" fill="${ink}"/><rect x="-1.5" y="-4.1" width="3" height="2" fill="${ink}"/>`}
  else if(it.t==="l")body=cone(50,16,amb,.16)+`<circle r="2.9" fill="${amb}"/><rect x="-2.2" y="-4" width="4.4" height="1.3" fill="${amb}"/>`;
  else body=`<rect x="-6.5" y="-3.8" width="13" height="7.6" rx="1" fill="${soft}" stroke="${ink}" stroke-width=".3"/>`;
  const sel=o.edit&&o.sel===it.id?`<circle cx="${it.x}" cy="${it.y}" r="7.4" fill="none" stroke="${red}" stroke-width=".4" stroke-dasharray="1.2 1"/>`:"";
  const lab=[it.label,it.t==="c"?(it.lens||"50mm")+" "+Math.round(fovDeg(it.lens,plan.sensor))+"°":""].filter(Boolean).join(" ");
  g+=`<g ${o.edit?`data-pi="${it.id}" style="cursor:grab"`:""}>${sel}<g transform="translate(${it.x} ${it.y}) rotate(${it.r||0})">${body}</g><text x="${it.x}" y="${it.y+(it.t==="o"?1.2:8.2)}" font-size="3.4" font-weight="600" fill="${ink}" text-anchor="middle" font-family="IBM Plex Sans KR,Malgun Gothic,sans-serif" pointer-events="none">${esc(lab)}</text></g>`;
 });
 return `<svg viewBox="0 0 ${PW} ${PH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="배치도">${g}</svg>`;
}
function pimgHtml(sc,big,ro){const src=sc.pimg&&IMG[sc.pimg];if(!src)return "";return ro?`<div class="pimg-thumb${big?" big":""}"><img src="${src}" alt="S#${esc(sc.no)} 배치도 그림"></div>`:`<button class="pimg-thumb${big?" big":""}" data-act="pimg-view" data-id="${sc.id}" aria-label="S#${esc(sc.no)} 배치도 그림 크게 보기"><img src="${src}" alt="S#${esc(sc.no)} 배치도 그림"></button>`}
function planThumb(sc,big){const pl=sc.plan;const svg=pl&&pl.items&&pl.items.length?`<button class="plan-thumb${big?" big":""}" data-act="plan" data-id="${sc.id}" aria-label="S#${esc(sc.no)} 배치도 고치기">${planSvg(pl)}</button>`:"";return svg+pimgHtml(sc,big)}
const PL={sc:null,sel:null};
function planSelHtml(){
 const it=PL.sc&&planOf(PL.sc).items.find(x=>x.id===PL.sel);
 if(!it)return `<p class="scn-status">항목을 눌러 고르고, 끌어서 옮겨요. 화살표 쪽이 보는 방향이에요.</p>`;
 return `<div class="field"><label for="pl-label">이름</label><input id="pl-label" class="input" value="${esc(it.label||"")}" maxlength="12"></div>
 ${it.t==="c"?`<div class="chips">${PC().lenses.map(v=>`<button class="chip" data-act="pl-lens" data-v="${v}" aria-pressed="${(it.lens||"50mm")===v}">${v}</button>`).join("")}<input id="pl-lens-in" class="input" inputmode="numeric" style="width:96px;min-height:40px" placeholder="직접 mm" aria-label="렌즈 직접 입력"></div>`:""}
 ${it.t==="l"?`<div class="chips">${PC().lights.map(v=>`<button class="chip" data-act="pl-name" data-v="${v}" aria-pressed="${it.label===v}">${v}</button>`).join("")}</div>`:""}
 <div class="row"><button class="btn quiet grow" data-act="pl-rot" data-d="-45">↺ 45°</button><button class="btn quiet grow" data-act="pl-rot" data-d="-15">↺ 15°</button><button class="btn quiet grow" data-act="pl-rot" data-d="15">↻ 15°</button><button class="btn quiet grow" data-act="pl-rot" data-d="45">↻ 45°</button></div>
 <div class="row"><button class="btn quiet grow" data-act="pl-dup">복제</button><button class="btn danger grow" data-act="pl-del">삭제</button></div>`;
}
function planRedraw(){const sv=$("#plan-svg");if(sv)sv.outerHTML=planSvg(planOf(PL.sc),{edit:true,sel:PL.sel}).replace("<svg ",'<svg id="plan-svg" ');const b=$("#plan-sel");if(b)b.innerHTML=planSelHtml();const t=$("#pl-line");if(t)t.setAttribute("aria-pressed",!!planOf(PL.sc).line)}
function openPlan(id){
 const p=cur(),sc=p.scenes.find(s=>s.id===id);if(!sc)return;PL.sc=sc;PL.sel=null;planOf(sc);
 const w=openSheet(`S#${sc.no} 배치도`,`<div class="plan-stage" id="plan-stage">${planSvg(sc.plan,{edit:true}).replace("<svg ",'<svg id="plan-svg" ')}</div>
  <div class="plan-tools" role="group" aria-label="추가"><button class="btn" data-act="pl-add" data-t="p">＋인물</button><button class="btn" data-act="pl-add" data-t="c">＋카메라</button><button class="btn" data-act="pl-add" data-t="l">＋조명</button><button class="btn" data-act="pl-add" data-t="o">＋사물</button><button class="btn toggle" id="pl-line" data-act="pl-line" aria-pressed="${!!sc.plan.line}">180°선</button></div>
  <div class="chips" role="group" aria-label="카메라 센서" id="pl-sensor"><span class="flabel" style="align-self:center;margin:0 4px 0 0">센서</span>${SENSORS.map(x=>`<button class="chip" data-act="pl-sensor" data-v="${x[0]}" aria-pressed="${(sc.plan.sensor||"FF")===x[0]}">${x[1]}</button>`).join("")}</div>
  <div id="plan-sel" style="min-height:240px">${planSelHtml()}</div>`,`<button class="btn solid grow" data-act="close-sheet">완료</button>`,{onClose:()=>{PL.sc=null;PL.sel=null}});
 const stage=$("#plan-stage",w);let drag=null;
 const pt=e=>{const sv=$("#plan-svg");const m=sv.getScreenCTM();if(!m)return[0,0];const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return[Math.min(PW,Math.max(0,q.x)),Math.min(PH,Math.max(0,q.y))]};
 stage.addEventListener("pointerdown",e=>{
  PL.down=true;const pl=planOf(PL.sc);const h=e.target.closest("[data-h]"),gi=e.target.closest("[data-pi]");const[x,y]=pt(e);
  if(h){drag={h:h.dataset.h,dx:0,dy:0}}else if(gi){const it=pl.items.find(i=>i.id===gi.dataset.pi);PL.sel=it.id;drag={it,dx:it.x-x,dy:it.y-y}}else{PL.sel=null}
  e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}drag&&(drag.moved=false);planRedraw();
 });
 stage.addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();const[x,y]=pt(e);const pl=planOf(PL.sc);
  if(drag.h){pl.line["x"+drag.h]=+x.toFixed(1);pl.line["y"+drag.h]=+y.toFixed(1)}else{drag.it.x=+(x+drag.dx).toFixed(1);drag.it.y=+(y+drag.dy).toFixed(1)}drag.moved=true;planRedraw()});
 const end=()=>{if(drag&&drag.moved)touch(cur());drag=null};stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);
 w.addEventListener("input",e=>{if(e.target.id==="pl-label"){const it=planOf(PL.sc).items.find(x=>x.id===PL.sel);if(it){it.label=e.target.value.slice(0,12);touch(cur());const sv=$("#plan-svg");if(sv)sv.outerHTML=planSvg(planOf(PL.sc),{edit:true,sel:PL.sel}).replace("<svg ",'<svg id="plan-svg" ')}}});
}

}
const VL={etag:"",at:0,busy:false,timer:null,fail:0};
async function loadView(quiet){
 const m=location.hash.match(/^#view=([A-Za-z0-9]+)\.([A-Za-z0-9]+)$/);if(!m)return;
 if(VL.busy)return;VL.busy=true;
 const [_,gist,pid]=m;if(!quiet||!VIEW)$("#app").innerHTML=`<div class="wrap" style="padding-block:40px"><p>샷리스트를 불러오는 중이에요.</p></div>`;
 try{
  const h={"Accept":"application/vnd.github+json"};if(quiet&&VIEW&&VL.etag)h["If-None-Match"]=VL.etag;
  const r=await fetch("https://api.github.com/gists/"+gist,{cache:"no-store",headers:h});
  if(r.status===304){VL.at=Date.now();VL.fail=0;viewStamp();return}
  if(r.status===403||r.status===429)throw{msg:"잠시 뒤 다시 열어 주세요. GitHub가 너무 잦은 요청을 막았어요."};
  if(!r.ok)throw{msg:"공유가 끝났거나 링크가 잘못됐어요. 보낸 사람에게 다시 받아 주세요."};
  VL.etag=r.headers.get("ETag")||"";const g=await r.json();const files=g.files||{};

function wxHtml(c,date){
 if(BUILD!=="web")return `<p class="scn-status">날씨 예보는 설치한 앱에서 볼 수 있어요.</p>`;

 if(diff>15)return `<p class="scn-status">날씨 예보는 촬영일 16일 전부터 나와요.</p>`;

 if(!w||(!w.loading&&!w.err&&Date.now()-w.at>30*6e4)){loadWx(k,c,date);if(!w||w.err||!w.d)return `<p class="scn-status">날씨를 불러오는 중이에요.</p>`}

 <div class="wx-h">${hrs.map(x=>`<div><span>${String(x.hr).padStart(2,"0")}시</span><b>${Math.round(x.temp)}°</b><span>${esc(wmo(x.code))}</span><span class="rain">${x.mm>0?x.mm.toFixed(1)+"mm":(x.rain??"-")+"%"}</span><span>${Math.round(x.wind)}m/s</span></div>`).join("")}</div>
 <p class="scn-status">${esc(c.city||"선택한 위치")} 기준 · ${clock(w.at)}에 받은 예보. ${trust} 날씨 자료: Open-Meteo</p>

}
async function loadWx(k,c,date){

 }catch(e){WX[k]=old?Object.assign(old,{loading:false}):{err:navigator.onLine===false?"인터넷이 없어 날씨를 못 불러왔어요.":"날씨를 불러오지 못했어요."}}
 const b=$("#wx-box"),p=cur();if(b&&p&&View.tab==="call"){const day=curDay(p),cc=callOf(p,day),dv=cc.date||(day==="1"?p.date:"")||"";if(wxKey(cc,dv)===k){b.innerHTML=wxHtml(cc,dv);tlRefresh()}}
}

/* ───────── 장소 검색 (Open-Meteo 지오코딩) ───────── */
function openPlace(){
 const w=openSheet("촬영 장소 찾기",`<div class="row" style="flex-wrap:nowrap"><input id="pf-q" class="input" style="flex:1;min-width:0" placeholder="예: 해운대, 남산, 강릉 경포" autocomplete="off"><button class="btn solid" data-act="place-go">찾기</button></div><div id="pf-r"><p class="scn-status">동, 구, 관광지 이름으로 찾아요. 정확한 자리는 그 장소에서 "현재 위치"를 눌러도 돼요.</p></div>`);
 const i=$("#pf-q",w);setTimeout(()=>i.focus(),40);i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();A["place-go"]()}});
}
let PF=[];

Object.assign(A,{
 "place-find"(){openPlace()},
 async "place-go"(){const q=($("#pf-q")||{}).value||"";const box=$("#pf-r");if(!q.trim()){box.innerHTML=`<p class="scn-status">찾을 장소를 적어 주세요.</p>`;return}
  if(BUILD!=="web"){box.innerHTML=`<p class="scn-status">장소 검색은 설치한 앱에서 돼요. 목록에서 지역을 고르거나 현재 위치를 써 주세요.</p>`;return}
  box.innerHTML=`<p class="scn-status">찾는 중이에요.</p>`;
  try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=8&language=ko&countryCode=KR`);if(!r.ok)throw 0;const j=await r.json();PF=(j.results||[]).filter(x=>isFinite(x.latitude)&&isFinite(x.longitude));
   box.innerHTML=PF.length?`<div class="dict">${PF.map((x,i)=>`<button class="ditem" style="width:100%;text-align:left;background:none" data-act="place-pick" data-i="${i}"><div><h3>${esc(x.name)}</h3><p>${esc([x.admin2,x.admin1].filter(Boolean).join(", "))}</p></div></button>`).join("")}</div>`:`<p class="scn-status">"${esc(q)}"을 찾지 못했어요. 더 큰 지역 이름(구, 시)으로 찾아 보세요.</p>`}
  catch(e){box.innerHTML=`<p class="scn-status">${navigator.onLine===false?"인터넷이 없어 찾을 수 없어요.":"찾지 못했어요. 잠시 뒤 다시 해 보세요."}</p>`}},
 "place-pick"(el){const x=PF[+el.dataset.i];if(!x)return;const p=cur(),c=callOf(p,curDay(p));c.city=[x.name,x.admin1].filter(Boolean).join(", ").slice(0,40);c.lat=+(+x.latitude).toFixed(4);c.lng=+(+x.longitude).toFixed(4);touch(p);closeSheet();render();toast(`${x.name} 기준으로 해 시간과 날씨를 맞췄어요.`)}
});

/* ───────── 장비 체크 ───────── */
function gearHtml(c){const g=PC().gear;if(!g.length)return "";const got=c.gear&&typeof c.gear==="object"?c.gear:{};const n=g.filter(x=>got[x]).length;
 return `<section class="csec"><h2>장비 체크 (${n}/${g.length})</h2><div class="gear">${g.map(x=>`<button class="chip" data-act="gear-tg" data-v="${esc(x)}" aria-pressed="${!!got[x]}">${got[x]?"✓ ":""}${esc(x)}</button>`).join("")}</div><div class="row"><button class="btn quiet" data-act="gear-clear">체크 모두 지우기</button><button class="btn quiet" data-act="my-opts">장비 목록 고치기</button></div></section>`}

/* ───────── 지운 씬·컷 보관 ───────── */
const BIN_DAYS=30;
function binAdd(p,e){if(!Array.isArray(p.bin))p.bin=[];p.bin.unshift(Object.assign({id:"b"+uid(),at:Date.now()},e));if(p.bin.length>100)p.bin.length=100}
function binPurge(p){if(!p||!Array.isArray(p.bin))return;const lim=Date.now()-BIN_DAYS*864e5,n=p.bin.length;p.bin=p.bin.filter(e=>e.at>=lim);if(p.bin.length!==n&&!p.example)touch(p)}
function openBin(){
 const p=cur();binPurge(p);const l=p.bin||[];
 if(!l.length){toast("지운 씬이나 컷이 없어요.");return}
 openSheet("지운 씬·컷",`<p style="color:var(--muted);font-size:14px">지운 씬과 컷은 ${BIN_DAYS}일 동안 여기 있다가 자동으로 지워져요.</p><div class="dict">${l.map(e=>{const left=Math.max(1,Math.ceil((e.at+BIN_DAYS*864e5-Date.now())/864e5));const t=e.type==="scene"?`<h3>S#${esc(e.scene.no)} ${esc(e.scene.loc||"")} <small>씬, 컷 ${e.scene.cuts.length}개</small></h3>`:`<h3>${esc(e.label)} ${esc(e.cut.size||"")} <small>컷</small></h3><p>${esc(e.cut.desc||"")}</p>`;return `<div class="ditem trow"><div style="min-width:0;flex:1">${t}<p>${left}일 뒤 완전히 삭제</p></div><div class="row" style="flex:none"><button class="btn" data-act="bin-back" data-id="${e.id}">되살리기</button><button class="btn danger" data-act="bin-kill" data-id="${e.id}">완전 삭제</button></div></div>`}).join("")}</div>`,`<button class="btn danger grow" data-act="bin-empty">모두 완전히 삭제</button>`);
}

Object.assign(A,{
 "ex-copy"(){const p=cur();const n=normP(JSON.parse(JSON.stringify(p)));n.id=uid();n.name=String(p.name).replace(/^예시:\s*/,"")||"내 작품";delete n.example;delete n.trashed;S.projects[n.id]=n;touch(n);while(sheetStack.length)closeSheet();View.pid=n.id;View.tab="list";setHash("p-"+n.id);render();toast(`"${n.name}"을 내 작품으로 만들었어요.`)},
 bin(){while(sheetStack.length)closeSheet();openBin()},
 "bin-back"(el){const p=cur(),i=(p.bin||[]).findIndex(e=>e.id===el.dataset.id);if(i<0)return;const e=p.bin[i];
  if(e.type==="scene"){const sc=normP({scenes:[e.scene]}).scenes[0];if(p.scenes.some(x=>x.id===sc.id))sc.id=uid();p.scenes.splice(Math.min(e.index,p.scenes.length),0,sc)}
  else{let sc=p.scenes.find(x=>x.id===e.sceneId);if(!sc){sc=normP({scenes:[{no:e.sceneNo||nextSceneNo(p),loc:"되살린 컷"}]}).scenes[0];p.scenes.push(sc)}const c=normP({scenes:[{cuts:[e.cut]}]}).scenes[0].cuts[0];if(allCuts(p).some(x=>x.c.id===c.id))c.id=uid();sc.cuts.splice(Math.min(e.index,sc.cuts.length),0,c)}
  p.bin.splice(i,1);touch(p);closeSheet();render();if(p.bin.length)openBin();toast(e.type==="scene"?`S#${e.scene.no} 씬을 되살렸어요.`:`${e.label} 컷을 되살렸어요.`)},
 "bin-kill"(el){const p=cur();p.bin=(p.bin||[]).filter(e=>e.id!==el.dataset.id);touch(p);closeSheet();if(p.bin.length)openBin();toast("완전히 삭제했어요.")},
 "bin-empty"(){openSheet("모두 완전히 삭제할까요?",`<p>지운 씬·컷 ${(cur().bin||[]).length}개가 되살릴 수 없게 지워져요.</p>`,`<button class="btn quiet grow" data-act="close-sheet">취소</button><button class="btn danger grow" data-act="bin-empty-yes">모두 완전히 삭제</button>`)},
 "bin-empty-yes"(){const p=cur();p.bin=[];touch(p);while(sheetStack.length)closeSheet();toast("지운 씬·컷을 비웠어요.")},
 "gear-tg"(el){const p=cur(),c=callOf(p,curDay(p));if(!c.gear||typeof c.gear!=="object")c.gear={};const v=el.dataset.v;if(c.gear[v])delete c.gear[v];else c.gear[v]=true;touch(p);render()},
 "gear-clear"(){const p=cur(),c=callOf(p,curDay(p));c.gear={};touch(p);render()},
 "wx-retry"(el){delete WX[el.dataset.k];render()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("more")&&d.closest("#f-img")===null&&$("#c-desc")&&d.contains($("#c-min"))){S.prefs.edMore=d.open;saveLocal()}},true);
document.addEventListener("input",e=>{if(e.target.id==="list-q"){View.q=e.target.value;const b=$("#list-body"),p=cur();if(b&&p)b.innerHTML=listBody(p)}});
document.addEventListener("change",e=>{if(e.target.id==="c-label"&&Ed){const p=cur(),f=findCut(p,Ed.id);const v=e.target.value.trim().replace(/[^\w가-힣]/g,"").slice(0,6);if(v)f.c.label=v;else delete f.c.label;e.target.value=v;touch(p);const h=$(".sheet-head h2",e.target.closest(".sheet"));if(h)h.textContent=`컷 ${f.sc.no}-${cutNo(f.sc,f.sc.cuts.indexOf(f.c))}`}});

/* ───────── 시작 ───────── */
function routeFromHash(){const h=location.hash.slice(1);if(h.startsWith("p-")&&S.projects[h.slice(2)]){View.pid=h.slice(2)}else if(!h)View.pid=null}
if(VIEW_MODE){loadView()}else{
loadLocal();applyMyTerms();
if(!S.prefs.seeded){S.prefs.seeded=true;const e=normP(exampleProject());S.projects[e.id]=e;saveLocal()}
const justLinked=BUILD==="web"&&consumeLink();
routeFromHash();
render();
if(BUILD==="web"){ghLoad();if(GH.cfg){startGh();if(justLinked)toast("이 기기를 연동했어요. 작품을 불러오는 중이에요.")}}
window.addEventListener("hashchange",()=>{if(sheetStack.length)return;routeFromHash();render()});
setInterval(()=>{if(View.pid&&!sheetStack.length&&!document.activeElement.matches?.("input,textarea")&&!document.querySelector(".dragging")){const t=document.querySelector(".prog-t");if(t){const st=stats(cur());const spans=t.querySelectorAll("span");if(spans[1])spans[1].innerHTML=`남은 ${st.remain}컷, 약 <b>${minLabel(st.remMin)}</b>${st.remain?` · ${clock(Date.now()+st.remMin*60000)} 종료 예상`:""}`}}},30000);
initSync();
}
</script>
