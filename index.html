/* 레이아웃: 제작 현장의 스트립보드. 씬은 실제 관례 색의 띠, 컷은 두 줄, 샷 코드는 카메라 테이프. */
:root{
  --paper:#E9EDEC;--card:#FAFBFA;--raise:#FFFFFF;--ink:#17222C;--muted:#55626D;--line:#C9D1D0;
  --tape:#17222C;--tape-fg:#F7F8F4;--tally:#CF1F2E;--tally-fg:#FFFFFF;--ok:#0E7C58;--ok-fg:#FFFFFF;--keep:#A86A00;--keep-fg:#FFFFFF;--soft:#DDE3E1;
  --s-di:#FFFFFF;--s-di-fg:#17222C;--s-de:#F4D230;--s-de-fg:#17222C;--s-ni:#2F67B8;--s-ni-fg:#FFFFFF;--s-ne:#1F8A5B;--s-ne-fg:#FFFFFF;--s-m:#F3B0C0;--s-m-fg:#17222C;--s-e:#EE9A3C;--s-e-fg:#17222C;
  --code:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10171E;--card:#18222B;--raise:#202C37;--ink:#E9EEF0;--muted:#9BA9B3;--line:#31404C;
  --tape:#E9EEF0;--tape-fg:#10171E;--tally:#F04452;--tally-fg:#10171E;--ok:#3CC796;--ok-fg:#08261B;--keep:#E7AE45;--keep-fg:#2B1D00;--soft:#26333E;
  --s-di:#DDE2E2;--s-di-fg:#10171E;--s-de:#D9BA2A;--s-de-fg:#10171E;--s-ni:#4C84D6;--s-ni-fg:#08131F;--s-ne:#38AD7B;--s-ne-fg:#06170F;--s-m:#E5A1B2;--s-m-fg:#10171E;--s-e:#E39238;--s-e-fg:#10171E;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10171E;--card:#18222B;--raise:#202C37;--ink:#E9EEF0;--muted:#9BA9B3;--line:#31404C;
  --tape:#E9EEF0;--tape-fg:#10171E;--tally:#F04452;--tally-fg:#10171E;--ok:#3CC796;--ok-fg:#08261B;--keep:#E7AE45;--keep-fg:#2B1D00;--soft:#26333E;
  --s-di:#DDE2E2;--s-di-fg:#10171E;--s-de:#D9BA2A;--s-de-fg:#10171E;--s-ni:#4C84D6;--s-ni-fg:#08131F;--s-ne:#38AD7B;--s-ne-fg:#06170F;--s-m:#E5A1B2;--s-m-fg:#10171E;--s-e:#E39238;--s-e-fg:#10171E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body);overflow-x:hidden;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--s-ni);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px;padding-block:6px}
.top h1{font-size:17px;font-weight:700;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;flex:none}
.icon:hover{background:var(--soft)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.code{font-family:var(--code);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 카메라 테이프 */
.tape{display:inline-flex;align-items:center;justify-content:center;background:var(--tape);color:var(--tape-fg);font:700 17px/1 var(--code);letter-spacing:.03em;padding:4px 9px 4px;min-width:42px;white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 3px) 20%,100% 40%,calc(100% - 3px) 60%,100% 80%,calc(100% - 3px) 100%,0 100%,3px 80%,0 60%,3px 40%,0 20%)}
.tape.empty{background:var(--soft);color:var(--muted)}
.tape.term{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);clip-path:none;border-radius:2px;font-size:14px;padding:3px 6px;min-width:0}
/* 진행 막대: 컷 하나가 칸 하나 */
.bar{display:flex;gap:2px;height:10px}
.bar i{flex:1 1 0;min-width:1px;background:var(--line)}
.bar i.done{background:var(--ok)}.bar i.skip{background:var(--muted);opacity:.45}.bar i.now{background:var(--tally)}
.prog{padding-block:0 10px;display:grid;gap:6px}
.prog-t{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.prog-t b{color:var(--ink);font-weight:700}
main{padding-block:14px 110px}
/* 홈 */
.home-head{padding-block:26px 18px}
.home-head h2{font:700 54px/.95 var(--code);letter-spacing:.005em}
.home-head p{color:var(--muted);margin-top:8px;max-width:34em}
.plist{display:grid;gap:10px}
.pwrap{position:relative}
.pdel{position:absolute;top:6px;right:6px;color:var(--muted);z-index:1}
.pdel:hover{color:var(--tally)}
.pitem h3{padding-right:40px}
.pitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:14px 14px 12px}
.pitem:hover{border-color:var(--ink)}
.pitem h3{font-size:17px;font-weight:700;line-height:1.3}
.pmeta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.strips{display:flex;gap:2px;height:8px;margin-bottom:8px}
.strips i{flex:1 1 0;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:9px 15px;border:1.5px solid var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;background:transparent}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--ink);opacity:.9}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--tally);color:var(--tally)}
.btn.grow{flex:1 1 0}
.sync{font-size:13px;color:var(--muted);margin-top:18px}
/* 스트립보드 */
.scene{margin-bottom:18px}
.strip{display:flex;align-items:stretch;background:var(--sbg);color:var(--sfg);box-shadow:inset 0 0 0 1px rgba(23,34,44,.28)}
.strip-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:7px 4px 7px 12px;min-height:48px;color:inherit}
.strip-no{font:700 26px/1 var(--code);flex:none}
.strip-tt{min-width:0;line-height:1.3}
.strip-tt b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-tt span{font:600 15px/1.1 var(--code);letter-spacing:.03em}
.strip-add{flex:none;font-weight:700;padding:0 13px;min-width:48px;font-size:14px;color:inherit;border-left:1px solid rgba(23,34,44,.28)}
.cuts{background:var(--card);border:1px solid var(--line);border-top:0;min-height:12px}
.cut{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--card);position:relative}
.cut:first-child{border-top:0}
.drop-line{height:4px;background:var(--tally);margin-block:-2px;position:relative;z-index:4}
.cut.dragging{z-index:5;opacity:.92;box-shadow:0 8px 22px rgba(0,0,0,.28);background:var(--raise)}
.cut.is-done .cut-main{opacity:.62}
.cut.is-skip .cut-main{opacity:.45}
.cut.is-skip .cut-desc{text-decoration:line-through}
.cut-main{flex:1;min-width:0;text-align:left;padding:10px 4px 10px 12px;display:grid;gap:5px}
.cut-l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cut-no{font:700 21px/1 var(--code);min-width:32px;font-variant-numeric:tabular-nums}
.cut-spec{font-size:13.5px;font-weight:500}
.cut-desc{font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.cut-desc.none{color:var(--muted)}
.cut-note{font-size:12.5px;color:var(--muted)}
.mark{font-size:12px;font-weight:700;padding:1px 6px;border-radius:2px}
.mark.opt{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.mark.ok{background:var(--ok);color:var(--ok-fg)}
.mark.skip{background:var(--muted);color:var(--card)}
.star{color:var(--keep);font-size:16px;line-height:1}
.cut-side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:none;width:46px}
.cut-min{font:600 14px/1 var(--code);color:var(--muted);padding-top:13px}
.drag{width:46px;height:40px;display:grid;place-items:center;touch-action:none;color:var(--muted);cursor:grab}
.drag svg{width:18px;height:18px;fill:currentColor}
.add-cut{width:100%;min-height:46px;border-top:1px dashed var(--line);color:var(--muted);font-weight:500}
.add-cut:hover{color:var(--ink);background:var(--soft)}
.blank{padding:34px 18px;text-align:center;border:1.5px dashed var(--line)}

function normP(p){
 p=Object.assign({id:uid(),name:"제목 없는 작품",scenes:[],order:[],director:"",dop:"",date:"",wrap:"",aspect:"16:9",fps:"",gear:"",updatedAt:Date.now()},p);
 if(!Array.isArray(p.scenes))p.scenes=[];if(!Array.isArray(p.order))p.order=[];
 p.scenes=p.scenes.map(sc=>{sc=Object.assign({id:uid(),no:"1",time:"D",place:"INT",loc:"",note:"",day:"1",cuts:[]},sc);if(!Array.isArray(sc.cuts))sc.cuts=[];
  sc.cuts=sc.cuts.map(c=>{c=Object.assign({id:uid(),size:"",angle:"",moves:[],lens:"",terms:[],desc:"",note:"",min:10,star:false,opt:false,status:"todo",takes:[],img:"",fps:""},c);["moves","terms","takes"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});return c});return sc});
 return p;

/* 기기 간 동기화: 있으면 쓰고, 없으면 이 기기에만 저장 */
const Sync={db:null,col:null,state:"local",timers:{},busy:{},pendingRemote:{}};
async function initSync(){
 if(!window.claude||typeof window.claude.use!=="function"){return}
 try{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  Sync.db=db;Sync.col=db.collection("data/users/"+id);Sync.state="syncing";refreshSync();
  Sync.col.onSnapshot(onRemote,()=>{Sync.state="local";Sync.col=null;refreshSync()});
 }catch(e){Sync.state="local";refreshSync()}
}
function onRemote(snap){
 const seen={},seenImg={};
 let changed=false;
 snap.docs.forEach(d=>{if(S.gone[d.id]){seen[d.id]=true;delRemote(d.id);return}const r=d.data();if(r&&r.kind==="img"){seenImg[d.id]=true;if(!IMG[d.id]&&typeof r.data==="string"){IMG[d.id]=r.data;idbPut(d.id,r.data);changed=true}return}if(!r||!r.id||!Array.isArray(r.scenes))return;seen[r.id]=true;const l=S.projects[r.id];
  if(!l||(r.updatedAt||0)>(l.updatedAt||0)||l.example){
    if(sheetStack.length&&View.pid===r.id){Sync.pendingRemote[r.id]=r}
    else{S.projects[r.id]=normP(JSON.parse(JSON.stringify(r)));changed=true}
  }else if((l.updatedAt||0)>(r.updatedAt||0)){queueSync(l)}
  S.synced[r.id]=true});
 if(!snap.metadata.fromCache){
  Object.keys(S.projects).forEach(id=>{const p=S.projects[id];if(seen[id]||p.example)return;
   if(S.synced[id]){if(!(Sync.timers[id]||Sync.busy[id])){delete S.projects[id];delete S.synced[id];changed=true}}else queueSync(p)});
  Object.values(S.projects).forEach(p=>{if(p.example)return;allCuts(p).forEach(x=>{const i=x.c.img;if(i&&IMG[i]&&!seenImg[i])pushImg(i)})});
  Sync.state="on";
 }
 saveLocal();refreshSync();
 if(changed&&!sheetStack.length)render();
}
function queueSync(p){
 if(!Sync.col||p.example)return;
 clearTimeout(Sync.timers[p.id]);
 Sync.timers[p.id]=setTimeout(()=>pushP(p.id),700);
}
async function pushP(id,retry){
 delete Sync.timers[id];
 const p=S.projects[id];if(!p||!Sync.col)return;
 if(Sync.busy[id]){Sync.timers[id]=setTimeout(()=>pushP(id),500);return}
 Sync.busy[id]=true;
 try{await Sync.col.doc(id).set(JSON.parse(JSON.stringify(p)));S.synced[id]=true;saveLocal()}
 catch(e){
  if(e&&e.code==="unavailable"&&!retry){Sync.busy[id]=false;setTimeout(()=>pushP(id,true),1200+Math.random()*800);return}
  if(e&&e.code==="quota_exceeded")toast("동기화 공간이 가득 찼어요. 안 쓰는 작품을 삭제해 주세요.");
  else{Sync.state="retry";refreshSync()}
 }
 Sync.busy[id]=false;
}
async function delRemote(id){delete S.synced[id];if(!Sync.col)return;clearTimeout(Sync.timers[id]);delete Sync.timers[id];S.gone[id]=Date.now();saveLocal();try{await Sync.col.doc(id).delete();if(!Sync.col)return;delete S.gone[id];saveLocal()}catch(e){}}
function syncText(){return {bad:"연동 열쇠가 만료됐거나 지워졌어요. 기기 연동에서 다시 연결해 주세요.",local:BUILD==="web"?"이 기기에만 저장돼요. 기기 연동을 켜면 컴퓨터와 폰의 작품이 자동으로 맞춰져요.":"이 기기의 브라우저에 저장돼요. 다른 기기로 옮기려면 백업 파일을 쓰세요.",syncing:"저장된 작품을 불러오는 중이에요.",on:BUILD==="web"?"기기 연동이 켜져 있어요. 연동한 컴퓨터와 폰의 작품이 자동으로 맞춰져요.":"같은 계정의 폰, 태블릿, 컴퓨터에 자동으로 맞춰져요.",retry:"인터넷이 없어 이 기기에 저장 중이에요. 다시 연결되면 자동으로 맞춰져요."}[Sync.state]}

function shootList(p){
 const a=allCuts(p),idx={};p.order.forEach((id,i)=>idx[id]=i);
 const known=a.filter(x=>x.c.id in idx).sort((x,y)=>idx[x.c.id]-idx[y.c.id]);

}
function stats(p){const a=allCuts(p);const done=a.filter(x=>x.c.status==="done").length,skip=a.filter(x=>x.c.status==="skip").length;const rem=a.filter(x=>x.c.status==="todo");return{total:a.length,done,skip,remain:rem.length,remMin:rem.reduce((s,x)=>s+(+x.c.min||0),0),totalMin:a.reduce((s,x)=>s+(+x.c.min||0),0)}}

function currentShoot(p){const l=shootView(p);if(!l.length)return null;let x=l.find(i=>i.c.id===View.shootId);if(!x){x=l.find(i=>i.c.status==="todo");if(x)View.shootId=x.c.id}return x||null}

 ${View.ngFor===c.id&&c.takes.length?`<div class="reasons"><span>테이크 ${c.takes[c.takes.length-1].n}을 왜 다시 찍나요? (안 눌러도 돼요)</span>${NG_REASONS.map(r=>`<button class="chip" data-act="reason" data-r="${esc(r)}" aria-pressed="${c.takes[c.takes.length-1].note===r}">${esc(r)}</button>`).join("")}</div>`:""}

function queueHtml(p,l,curId){return `<div class="queue-t"><span>촬영 순서</span><button class="btn quiet" style="min-height:38px;padding:4px 10px;font-size:13px" data-act="order-sheet">순서 바꾸기</button></div><div class="queue">${l.map(x=>`<button class="qitem ${x.c.id===curId?"cur":""} ${x.c.status}" data-act="shoot-go" data-id="${x.c.id}" ${x.c.id===curId?'aria-current="true"':""}><span class="sw" style="${stripVars(x.sc)}"></span><span class="n">${esc(x.no)}</span><span class="tape" style="font-size:14px;min-width:36px">${esc(x.c.size||"미정")}</span><span class="d">${x.c.status==="done"?"OK ":""}${esc(x.c.desc||specLine(x.c))}</span></button>`).join("")}</div>`}
function matchT(t,q){q=q.toLowerCase().replace(/[\s.\-]/g,"");if(!q)return true;return (t.code+t.ko+t.en+t.desc).toLowerCase().replace(/[\s.\-]/g,"").includes(q)}

const sheetStack=[];
function openSheet(title,bodyHtml,footHtml,opts={}){
 const wrap=document.createElement("div");wrap.className="sheet-wrap";
 const labelId="s"+uid();
 wrap.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${labelId}" tabindex="-1"><div class="sheet-head"><h2 id="${labelId}">${esc(title)}</h2>${opts.headExtra||""}<button class="icon" data-act="close-sheet" aria-label="닫기">${ICON.close}</button></div><div class="sheet-body">${bodyHtml}</div>${footHtml?`<div class="sheet-foot">${footHtml}</div>`:""}</div>`;
 const rec={wrap,onClose:opts.onClose,focus:document.activeElement};
 wrap.addEventListener("pointerdown",e=>{rec.bgDown=e.target===wrap});
 wrap.addEventListener("click",e=>{if(e.target===wrap&&rec.bgDown)closeSheet()});
 $("#sheets").appendChild(wrap);sheetStack.push(rec);document.body.classList.add("locked");
 $(".sheet",wrap).focus({preventScroll:true});
 return wrap;
}
function closeSheet(){
 const rec=sheetStack.pop();if(!rec)return;
 rec.wrap.remove();
 if(rec.onClose)rec.onClose();
 if(!sheetStack.length){
  document.body.classList.remove("locked");
  Object.keys(Sync.pendingRemote).forEach(id=>{const r=Sync.pendingRemote[id],l=S.projects[id];if(!l||(r.updatedAt||0)>(l.updatedAt||0))S.projects[id]=normP(JSON.parse(JSON.stringify(r)));delete Sync.pendingRemote[id]});
  render();
 }
 if(rec.focus&&document.contains(rec.focus))rec.focus.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetStack.length){e.preventDefault();closeSheet()}});

function findCut(p,id){for(const sc of p.scenes){const i=sc.cuts.findIndex(c=>c.id===id);if(i>=0)return{sc,c:sc.cuts[i],i}}return null}
function pickBtn(field,c){
 const has=field==="moves"?c.moves.length:field==="terms"?c.terms.length:!!c[field];
 const labels={size:"샷 사이즈",angle:"앵글",moves:"카메라 무빙",lens:"렌즈",terms:"시나리오·편집 용어"};
 const catOf={size:"size",angle:"angle",moves:"move",lens:"lens",terms:"term"}[field];
 const val=Array.isArray(c[field])?c[field].join(", "):c[field];
 const first=Array.isArray(c[field])?c[field][0]:c[field];
 const t=findT(catOf,first);
 return `<button class="pick" data-act="pick" data-field="${field}">${t||has?dgHtml(t||{code:first,cat:catOf}):`<span class="dg none">+</span>`}<span class="pick-v"><small>${labels[field]}</small><b>${esc(has?val:"고르기")}</b>${field==="size"&&t?`<small>${esc(t.ko)}</small>`:""}</span></button>`;
}
function quickChips(field,c){
 let q={size:SIZE_QUICK,angle:ANGLE_QUICK,moves:MOVE_QUICK,lens:LENS_QUICK,terms:TERM_QUICK}[field];
 const cnt={};allCuts(cur()).forEach(x=>{[].concat(x.c[field]||[]).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1})});
 const used=Object.keys(cnt).filter(v=>!q.includes(v)).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);q=used.concat(q);
 return `<div class="chips">${q.map(v=>{const on=Array.isArray(c[field])?c[field].includes(v):c[field]===v;return `<button class="chip ${field==="size"||field==="terms"?"code":""}" data-act="quick" data-field="${field}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`}).join("")}</div>`;
}

 `<div class="field"><label for="c-desc">어떻게 찍을지 (카메라 위치, 담을 것, 핵심 한 가지)</label><textarea id="c-desc" class="input" rows="3" placeholder="노트북 너머 정면, 뒤에서 다가오는 인물로 초점을 넘김.">${esc(c.desc)}</textarea></div>

const segDay=sc=>["1","2","3","4","5","6"].map(v=>`<button data-act="sc-day" data-v="${v}" aria-pressed="${(sc.day||"1")===v}">${v}</button>`).join("");
const segPlace=sc=>["INT","EXT"].map(v=>`<button data-act="sc-place" data-v="${v}" aria-pressed="${sc.place===v}">${v==="INT"?"INT 실내":"EXT 실외"}</button>`).join("");
const segTime=sc=>["D","N","M","E"].map(v=>`<button data-act="sc-time" data-v="${v}" aria-pressed="${sc.time===v}">${v} ${TIME_LABEL[v]}</button>`).join("");
function openSceneEditor(id){
 const p=cur(),sc=p.scenes.find(s=>s.id===id);if(!sc)return;ScEd={id};
 const w=openSheet("씬 정보",sceneBody(sc),`<button class="btn solid grow" data-act="close-sheet">완료</button>`,{onClose:()=>{ScEd=null}});
 $("#sc-no",w).addEventListener("input",e=>{sc.no=e.target.value.trim().slice(0,8)||"?";touch(p)});
 $("#sc-loc",w).addEventListener("input",e=>{sc.loc=e.target.value;touch(p)});

function refreshSceneSeg(sc){$("#seg-day").innerHTML=segDay(sc);$("#seg-place").innerHTML=segPlace(sc);$("#seg-time").innerHTML=segTime(sc);$("#sc-prev").innerHTML=`<div class="strip" style="${stripVars(sc)};padding:8px 12px;font-size:13.5px">스트립보드 색: ${sc.time} ${sc.place}</div>`}
function nextSceneNo(p){const n=p.scenes.map(s=>parseInt(s.no,10)).filter(x=>!isNaN(x));return String(n.length?Math.max(...n)+1:1)}
function newScene(p){const prev=p.scenes[p.scenes.length-1];const sc={id:uid(),no:nextSceneNo(p),time:prev?prev.time:"D",place:prev?prev.place:"INT",loc:"",note:"",day:prev?prev.day:"1",cuts:[]};p.scenes.push(sc);touch(p);return sc}
function newCut(p,sc){const prev=sc.cuts[sc.cuts.length-1];const c=normP({scenes:[{cuts:[{size:"",angle:"아이레벨",moves:["고정"],lens:prev?prev.lens:"",fps:prev?prev.fps:""}]}]}).scenes[0].cuts[0];sc.cuts.push(c);touch(p);return c}
function textPrompt(title,label,val,okLabel,cb){
 const w=openSheet(title,`<div class="field"><label for="tp-v">${esc(label)}</label><input id="tp-v" class="input" value="${esc(val)}" placeholder="예: 마지막 동아리실"></div>`,`<button class="btn solid grow" data-act="tp-ok">${esc(okLabel)}</button>`);
 const inp=$("#tp-v",w);setTimeout(()=>{inp.focus();inp.select()},30);
 const ok=()=>{const v=inp.value.trim();if(!v){inp.focus();return}closeSheet();cb(v)};
 w._ok=ok;inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ok()}});
}

/* ───────── 내보내기 ───────── */
function textOf(p){
 const out=[`[${p.name}] 샷리스트`,""];
 p.scenes.forEach(sc=>{out.push(`S#${sc.no}  ${sc.time} ${sc.place} · ${sc.loc||"장소 미정"} · ${TIME_LABEL[sc.time]}`,"");sc.cuts.forEach((c,i)=>{out.push(`${sc.no}-${i+1}${c.star?" ★":""}${c.opt?" (선택)":""} · ${[c.size||"사이즈 미정",c.angle,c.moves.join(" + "),c.lens,c.fps?c.fps+"fps":"",...c.terms].filter(Boolean).join(" · ")}`);if(c.desc)out.push(c.desc);if(c.note)out.push("메모: "+c.note);out.push("")})});
 return out.join("\n").trim();
}
function csvOf(p){
 const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
 const rows=[["씬","컷","시간","장소구분","장소","샷 사이즈","앵글","무빙","렌즈","FPS","용어","어떻게 찍을지","메모","예상(분)","핵심","선택","상태","OK 테이크","테이크 기록"]];
 p.scenes.forEach(sc=>sc.cuts.forEach((c,i)=>{const ok=c.takes.filter(t=>t.r==="ok").map(t=>t.n).join(",");rows.push([sc.no,i+1,sc.time,sc.place,sc.loc,c.size,c.angle,c.moves.join(" + "),c.lens,c.fps,c.terms.join(", "),c.desc,c.note,c.min,c.star?"O":"",c.opt?"O":"",{todo:"대기",done:"완료",skip:"건너뜀"}[c.status],ok,c.takes.map(t=>`T${t.n} ${t.r.toUpperCase()}${t.note?" "+t.note:""}`).join(" / ")])}));
 return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}

 const color={di:["#fff","#111"],de:["#F4D230","#111"],ni:["#2F67B8","#fff"],ne:["#1F8A5B","#fff"],m:["#F3B0C0","#111"],e:["#EE9A3C","#111"]};
 const st=stats(p);
 return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.name)} 샷리스트</title><style>
 @page{size:A4 landscape;margin:12mm}body{font:12px/1.4 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111;margin:16px}h1{font-size:20px;margin:0}.m{color:#555;margin:2px 0 12px}
 table{width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:14px;page-break-inside:auto}thead{display:table-header-group}tr{page-break-inside:avoid}th,td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
 th{background:#eee;font-weight:700}.s th{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13px}.n{font-weight:700;overflow-wrap:anywhere}.bx{display:inline-block;width:13px;height:13px;border:1.5px solid #111}
 .p{margin-bottom:12px}button{padding:10px 16px;font:inherit}@media print{.p{display:none}body{margin:0}}</style></head><body>
 <div class="p"><button onclick="window.print()">인쇄 또는 PDF로 저장</button></div><h1>${esc(p.name)} 샷리스트</h1><p class="m">${esc([p.date,p.director&&"감독 "+p.director,p.dop&&"촬영 "+p.dop,p.aspect,p.fps&&p.fps+"fps"].filter(Boolean).join(" / "))}${p.date||p.director||p.dop?"<br>":""}씬 ${p.scenes.length}개, 컷 ${st.total}개, 예상 ${minLabel(st.totalMin)}</p>
 ${p.scenes.map(sc=>{const k=color[stripKey(sc)];return `<table><colgroup><col style="width:6%"><col style="width:9%"><col style="width:18%"><col style="width:32%"><col style="width:13%"><col style="width:4%"><col style="width:14%"><col style="width:4%"></colgroup><thead><tr class="s"><th colspan="8" style="background:${k[0]};color:${k[1]}">S#${esc(sc.no)}  ${sc.time} ${sc.place}  ${esc(sc.loc)}</th></tr><tr><th>컷</th><th>사이즈</th><th>앵글 / 무빙 / 렌즈</th><th>어떻게 찍을지</th><th>메모</th><th>분</th><th>테이크</th><th class="c">OK</th></tr></thead><tbody>${sc.cuts.map((c,i)=>`<tr><td class="n">${esc(sc.no)}-${i+1}${c.star?" ★":""}</td><td class="n">${esc(c.size)}${c.terms.length?"<br>"+esc(c.terms.join(", ")):""}</td><td>${esc(specLine(c))}</td><td>${c.img&&IMG[c.img]?`<img src="${IMG[c.img]}" alt="" style="display:block;width:100%;max-width:190px;margin-bottom:4px;border:1px solid #999">`:""}${esc(c.desc)}${c.opt?" (선택)":""}</td><td>${esc(c.note)}</td><td>${+c.min||""}</td><td>${esc(c.takes.map(t=>`T${t.n} ${t.r.toUpperCase()}${t.note?" "+t.note:""}`).join(", "))}</td><td class="c"><span class="bx" style="${c.status==="done"?"background:#111":""}"></span></td></tr>`).join("")}</tbody></table>`}).join("")}
 </body></html>`;
}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,"").trim().slice(0,60)||"샷리스트"}
async function saveFile(filename,data,mime){
 let dl=null;
 try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){}
 if(dl){
  try{await dl.save({filename,data});toast(filename+" 파일을 저장했어요.")}
  catch(e){if(e&&e.code==="declined")return;toast("파일을 저장하지 못했어요. 텍스트 복사를 써 주세요.")}
  return;
 }
 try{const b=new Blob([data],{type:mime||"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(filename+" 파일을 저장했어요.")}
 catch(e){toast("파일을 저장하지 못했어요. 텍스트 복사를 써 주세요.")}
}

async function copyText(t){
 try{await navigator.clipboard.writeText(t);toast("샷리스트를 복사했어요.");return true}
 catch(e){openSheet("복사할 내용",`<p>브라우저가 자동 복사를 막았어요. 아래 글을 길게 눌러 복사해 주세요.</p><textarea class="input copybox" readonly id="copy-fall">${esc(t)}</textarea>`);setTimeout(()=>{const a=$("#copy-fall");if(a){a.focus();a.select()}},40);return false}

/* ───────── 토스트 ───────── */
let toastT=null;
function toast(msg,undo){
 const slot=$("#toast-slot");clearTimeout(toastT);
 slot.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${undo?'<button data-act="undo">되돌리기</button>':""}</div>`;
 toastUndo=undo||null;
 toastT=setTimeout(()=>{slot.innerHTML="";toastUndo=null},undo?7000:3000);
}
let toastUndo=null;

/* ───────── 화면 켜짐 유지 ───────── */
let wake=null;
async function requestWake(){if(wake||!navigator.wakeLock)return;try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}catch(e){}}
function releaseWake(){if(wake){wake.release().catch(()=>{});wake=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&View.tab==="shoot"&&View.pid)requestWake()});

/* ───────── 끌어서 순서 바꾸기 (터치·마우스 공용) ─────────
   끄는 동안 항목을 DOM에서 옮기지 않는다. 옮기면 터치 포인터가 끊기는 브라우저가 있다. */
let dragJustEnded=false;
document.addEventListener("pointerdown",e=>{
 const h=e.target.closest("[data-drag]");if(!h)return;
 const item=h.closest("[data-item]");if(!item)return;
 const root=item.closest("[data-sort]"),kind=root.dataset.sort,pid=e.pointerId;
 e.preventDefault();
 const scroller=item.closest(".sheet-body");
 const getScroll=()=>scroller?scroller.scrollTop:window.scrollY;
 const startY=e.clientY,startS=getScroll();
 let lastY=e.clientY,lastX=e.clientX;
 const line=document.createElement("div");line.className="drop-line";
 item.classList.add("dragging");item.style.pointerEvents="none";
 try{h.setPointerCapture(pid)}catch(_){}
 function place(){
  item.style.transform=`translateY(${lastY-startY+getScroll()-startS}px)`;
  const under=document.elementFromPoint(lastX,lastY);if(!under||under===line)return;
  const other=under.closest("[data-item]");
  if(other&&other!==item&&other.closest("[data-sort]")?.dataset.sort===kind){
   const r=other.getBoundingClientRect();
   other.parentNode.insertBefore(line,lastY<r.top+r.height/2?other:other.nextSibling);
  }else if(other===null&&kind==="cuts"){
   const sc=under.closest(".scene");const c=sc&&sc.querySelector('[data-sort="cuts"]');
   if(c&&!c.querySelector("[data-item]"))c.appendChild(line);
  }
 }
 const scrollT=setInterval(()=>{const m=70,sp=9,y=lastY;let moved=false;
  if(scroller){const r=scroller.getBoundingClientRect();if(y<r.top+m){scroller.scrollTop-=sp;moved=true}else if(y>r.bottom-m){scroller.scrollTop+=sp;moved=true}}
  else{if(y<130){scrollBy(0,-sp);moved=true}else if(y>innerHeight-100){scrollBy(0,sp);moved=true}}
  if(moved)place()},40);
 function move(ev){if(ev.pointerId!==pid)return;lastY=ev.clientY;lastX=ev.clientX;place();ev.preventDefault()}
 function end(ev){
  if(ev.pointerId!==pid)return;
  clearInterval(scrollT);
  document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",end);document.removeEventListener("pointercancel",end);
  item.classList.remove("dragging");item.style.transform="";item.style.pointerEvents="";
  const cancelled=ev.type==="pointercancel"||!line.parentNode;
  if(line.parentNode){if(!cancelled)line.parentNode.insertBefore(item,line);line.remove()}
  dragJustEnded=true;setTimeout(()=>dragJustEnded=false,60);
  if(cancelled)return;
  const p=cur();
  if(kind==="order"){p.order=[...root.querySelectorAll("[data-item]")].map(n=>n.dataset.item);touch(p)}
  else{
   const byId={};allCuts(p).forEach(x=>byId[x.c.id]=x.c);
   document.querySelectorAll('[data-sort="cuts"]').forEach(n=>{const sc=p.scenes.find(s=>s.id===n.dataset.scene);if(sc)sc.cuts=[...n.querySelectorAll("[data-item]")].map(i=>byId[i.dataset.item]).filter(Boolean)});
   touch(p);if(allCuts(p).some(x=>x.c.takes.length))toast("컷 번호가 다시 매겨졌어요. 촬영 기록은 컷에 그대로 있어요.");
   render();
  }
 }
 document.addEventListener("pointermove",move,{passive:false});document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
});

/* ───────── 콘티 이미지 저장 (localStorage 용량을 쓰지 않음) ───────── */
let idb=null;
const idbReady=new Promise(res=>{try{const q=indexedDB.open("cutbycut-img",1);q.onupgradeneeded=()=>q.result.createObjectStore("i");q.onsuccess=()=>{idb=q.result;res()};q.onerror=()=>res();q.onblocked=()=>res()}catch(e){res()}});
function idbPut(k,v){idbReady.then(()=>{try{if(idb)idb.transaction("i","readwrite").objectStore("i").put(v,k)}catch(e){}})}
function idbDel(k){idbReady.then(()=>{try{if(idb)idb.transaction("i","readwrite").objectStore("i").delete(k)}catch(e){}})}
function pushImg(id){if(!Sync.col||!IMG[id])return;Sync.col.doc(id).set({kind:"img",data:IMG[id]}).catch(e=>{if(e&&e.code==="quota_exceeded")toast("동기화 공간이 가득 찼어요. 안 쓰는 작품을 삭제해 주세요.")})}
function imgPut(id,data){IMG[id]=data;idbPut(id,data);pushImg(id)}
function imgDel(id){delete IMG[id];idbDel(id);if(Sync.col)Sync.col.doc(id).delete().catch(()=>{})}
function imagesOf(p){const o={};allCuts(p).forEach(x=>{if(x.c.img&&IMG[x.c.img])o[x.c.img]=IMG[x.c.img]});return o}
idbReady.then(()=>{if(!idb)return;try{const out=idb.transaction("i").objectStore("i").openCursor();let any=false;out.onsuccess=()=>{const c=out.result;if(c){if(!IMG[c.key]){IMG[c.key]=c.value;any=true}c.continue()}else if(any&&!sheetStack.length)render()}}catch(e){}});

const ASPECT={"16:9":16/9,"1.85:1":1.85,"2.39:1":2.39,"4:3":4/3,"1:1":1,"9:16":9/16};
let Sk=null;
function openSketch(){
 const p=cur(),f=findCut(p,Ed.id),r=ASPECT[p.aspect]||16/9;
 const W=r>=1?960:540,H=Math.round(W/r);
 const w=openSheet(`콘티 ${f.sc.no}-${f.i+1}`,`<div class="sk-stage"><canvas id="sk-c" width="${W}" height="${H}" aria-label="콘티 그리는 칸"></canvas><div class="sk-grid" id="sk-grid" hidden></div></div>
  <div class="row" role="group" aria-label="펜">${[["#17222C","검정"],["#CF1F2E","빨강"],["#2F67B8","파랑"]].map((x,i)=>`<button class="pcolor" style="background:${x[0]}" data-act="sk-color" data-v="${x[0]}" aria-pressed="${i===0}" aria-label="${x[1]} 펜"></button>`).join("")}<button class="chip" data-act="sk-size" data-v="3" aria-pressed="true">가늘게</button><button class="chip" data-act="sk-size" data-v="8" aria-pressed="false">굵게</button><button class="chip" data-act="sk-eraser" aria-pressed="false">지우개</button></div>
  <div class="row"><button class="chip" data-act="sk-undo">되돌리기</button><button class="chip" data-act="sk-clear">전체 지우기</button><button class="chip" data-act="sk-base">${esc(f.c.size||"사이즈")} 그림 깔기</button><button class="chip" data-act="sk-photo">사진 넣기</button><button class="chip" data-act="sk-thirds" aria-pressed="false">3분할선</button></div>`,
  `<button class="btn quiet grow" data-act="close-sheet">취소</button><button class="btn solid grow" data-act="sk-save">콘티 저장</button>`,{onClose:()=>{Sk=null;const b=$("#f-img");if(b&&Ed){const q=findCut(cur(),Ed.id);if(q)b.innerHTML=imgField(q.c)}}});
 const c=$("#sk-c",w),g=c.getContext("2d",{willReadFrequently:true});
 g.fillStyle="#fff";g.fillRect(0,0,W,H);g.lineCap="round";g.lineJoin="round";
 Sk={c,g,W,H,color:"#17222C",size:3,eraser:false,undo:[],dirty:false,cutId:Ed.id};
 const src=f.c.img&&IMG[f.c.img];if(src){const im=new Image();im.onload=()=>{if(Sk)skDrawCover(im)};im.src=src}
 let on=null;
 const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
 const line=(x0,y0,x1,y1,pr)=>{g.strokeStyle=Sk.eraser?"#fff":Sk.color;g.lineWidth=(Sk.eraser?Sk.size*5:Sk.size)*(W/960)*(pr>0&&pr<1?.5+pr:1);g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()};
 c.addEventListener("pointerdown",e=>{e.preventDefault();skPush();Sk.dirty=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=pos(e);on={id:e.pointerId,x,y};line(x,y,x+.1,y+.1,e.pressure)});
 c.addEventListener("pointermove",e=>{if(!on||e.pointerId!==on.id)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>{const [x,y]=pos(ev);line(on.x,on.y,x,y,ev.pressure);on.x=x;on.y=y})});
 const stop=e=>{if(on&&e.pointerId===on.id)on=null};c.addEventListener("pointerup",stop);c.addEventListener("pointercancel",stop);
}
function skPush(){if(!Sk)return;Sk.undo.push(Sk.g.getImageData(0,0,Sk.W,Sk.H));if(Sk.undo.length>12)Sk.undo.shift()}
function skDrawCover(im,alpha){const{g,W,H}=Sk;const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,sc=Math.max(W/iw,H/ih),dw=iw*sc,dh=ih*sc;g.globalAlpha=alpha||1;g.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);g.globalAlpha=1}
$("#photo-file").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f||!Sk)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(Sk){skPush();Sk.dirty=true;skDrawCover(im)}URL.revokeObjectURL(u)};im.onerror=()=>{URL.revokeObjectURL(u);toast("이 사진을 열 수 없어요. JPG나 PNG 파일을 골라 주세요.")};im.src=u});

function wrapHtml(p,st){
 if(!p.wrap||!st.remain)return"";
 const[h,m]=p.wrap.split(":").map(Number);if(isNaN(h))return"";
 const t=new Date();t.setHours(h,m||0,0,0);if(Date.now()-t.getTime()>6*3600000)t.setDate(t.getDate()+1);
 const diff=Math.round((t.getTime()-Date.now())/60000-st.remMin);
 if(diff>=0)return `<p class="wrapline">랩 ${esc(p.wrap)}까지 ${minLabel(diff)} 여유</p>`;
 const opts=allCuts(p).filter(x=>x.c.opt&&x.c.status==="todo"),om=opts.reduce((a,x)=>a+(+x.c.min||0),0);
 return `<p class="wrapline over">랩 ${esc(p.wrap)}보다 ${minLabel(-diff)} 초과${opts.length?`. 선택 컷 ${opts.length}개를 빼면 ${minLabel(om)} 줄어요`:""}</p>`;
}

const HEAD=/^\s*(?:s\s*#|scene|sc\.|씬|#)\s*(\d+[a-z0-9\-]*)[\s.:)\]\-–—]*(.*)$/i;
const SLUG=/^\s*((?:int|ext|i\/e)\b\.?|실내|실외)[\s.,:\-–—]*(.*)$/i;
function parseHeading(raw){
 const place=/\bext\b|실외|야외/i.test(raw)?"EXT":"INT";
 const time=/새벽|아침|오전|\bmorning\b|\bdawn\b|[(\s/,]M[)\s/,.]/i.test(" "+raw+" ")?"M":/밤|심야|\bnight\b|[(\s/,]N[)\s/,.]/i.test(" "+raw+" ")?"N":/저녁|노을|해질|황혼|\bevening\b|\bdusk\b|[(\s/,]E[)\s/,.]/.test(" "+raw+" ")?"E":"D";
 const loc=raw.replace(/\b(?:int|ext|i\/e)\b\.?/ig,"").replace(/(?:\b(?:day|night|morning|evening|dawn|dusk)\b)|실내|실외|야외/ig,"").replace(/[(\[][^)\]]*[)\]]/g,"").replace(/(^|[\s/,.\-–—])(?:[DNME]|낮|밤|새벽|아침|오전|오후|저녁|심야|노을)(?=$|[\s/,.\-–—])/g,"$1").replace(/[\s/,.\-–—:]+$/,"").replace(/^[\s/,.\-–—:]+/,"").replace(/\s{2,}/g," ").trim();
 return{place,time,loc:loc.slice(0,60)};
}
function parseScenario(text){
 const out=[];let c=null;let auto=0;
 String(text).split(/\r?\n/).forEach(l=>{
  let m=l.match(HEAD),no=null,rest="";
  if(m&&l.trim().length<80){no=m[1];rest=m[2]}
  else if((m=l.match(SLUG))&&l.trim().length<80){auto++;no=String(auto);rest=l}
  if(no!==null){c=Object.assign({no,body:""},parseHeading(rest));out.push(c)}
  else if(c)c.body+=l+"\n";
 });
 return out;
}

function autoOrder(p){
 const sizeRank={};T.filter(t=>t.cat==="size").forEach((t,i)=>{sizeRank[t.code]=i});

 const rank=c=>c.size in sizeRank?sizeRank[c.size]:999;
 const a=allCuts(p);const groups=[];
 a.forEach(x=>{const k=[x.sc.day||"1",x.sc.place,x.sc.time,x.sc.loc].join("|");let g=groups.find(y=>y.k===k);if(!g){g={k,day:+(x.sc.day||1),items:[]};groups.push(g)}g.items.push(x)});
 groups.sort((u,v)=>u.day-v.day);
 const order=[];
 a.filter(x=>x.c.status!=="todo").forEach(x=>order.push(x.c.id));
 groups.forEach(g=>{const todo=g.items.filter(x=>x.c.status==="todo");const lens={};todo.forEach(x=>{const r=rank(x.c),l=x.c.lens||"";lens[l]=Math.min(lens[l]??9999,r)});
  todo.map((x,i)=>({x,i})).sort((u,v)=>(lens[u.x.c.lens||""]-lens[v.x.c.lens||""])||String(u.x.c.lens).localeCompare(String(v.x.c.lens))||(rank(u.x.c)-rank(v.x.c))||(u.i-v.i)).forEach(o=>order.push(o.x.c.id))});

}

async function ghFetch(path,opt={},token){
 const h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+(token||GH.cfg.token)};if(opt.body)h["Content-Type"]="application/json";
 const r=await fetch(GH.api+path,Object.assign({cache:"no-store"},opt,{headers:h}));
 if(r.status===401){const e=new Error("auth");e.code="auth";throw e}
 if(r.status===404||r.status===403){const e=new Error("http "+r.status);e.code="gone";throw e}
 if(!r.ok){const e=new Error("http "+r.status);e.code="net";throw e}
 return r.status===204?null:r.json();
}
async function ghFindOrCreate(token){
 for(let page=1;page<=5;page++){const l=await ghFetch(`/gists?per_page=100&page=${page}`,{},token);const g=l.find(x=>x.description==="cutbycut-sync");if(g)return g.id;if(l.length<100)break}
 const g=await ghFetch("/gists",{method:"POST",body:JSON.stringify({description:"cutbycut-sync",public:false,files:{"README.md":{content:"컷바이컷 기기 연동용 저장 공간이에요. 지우면 연동된 작품이 사라져요."}}})},token);
 return g.id;
}
function ghPatch(files){const run=()=>ghFetch("/gists/"+GH.cfg.gist,{method:"PATCH",body:JSON.stringify({files})}).then(x=>{GH.lastWrite=Date.now();return x});const p=GH.q.then(run,run);GH.q=p.catch(()=>{});return p}
async function ghPoll(){
 if(!GH.cfg||!GH.cb||document.visibilityState==="hidden"||Date.now()-GH.lastWrite<8000)return;
 await GH.q;
 try{
  const g=await ghFetch("/gists/"+GH.cfg.gist);const docs=[];
  for(const [name,f] of Object.entries(g.files||{})){
   if(!name.startsWith("cbc_"))continue;let txt=f.content;
   if(f.truncated){try{txt=await (await fetch(f.raw_url,{cache:"no-store"})).text()}catch(e){continue}}
   try{const d=JSON.parse(txt);docs.push({id:name.slice(4,-5),data:()=>d})}catch(e){}
  }
  if(GH.cb)GH.cb({docs,metadata:{fromCache:false}});
 }catch(e){if(e&&(e.code==="auth"||e.code==="gone")){Sync.state="bad";stopGh()}else Sync.state="retry";refreshSync()}
}
function stopGh(){clearInterval(GH.timer);GH.timer=null;GH.cb=null;Sync.col=null}
function startGh(){
 if(!GH.cfg)return;
 Sync.col={doc:id=>({
   set:async d=>{await ghPatch({["cbc_"+id+".json"]:{content:JSON.stringify(d)}});if(Sync.state==="retry"){Sync.state="on";refreshSync()}},
   delete:async()=>{try{await ghPatch({["cbc_"+id+".json"]:null})}catch(e){if(e&&e.code==="net"&&/422/.test(e.message))return;throw e}}})};
 Sync.state="syncing";refreshSync();GH.cb=onRemote;ghPoll();clearInterval(GH.timer);GH.timer=setInterval(ghPoll,20000);
}
const linkUrl=()=>location.origin+location.pathname+"#link="+btoa(GH.cfg.token+":"+GH.cfg.gist);
function consumeLink(){const m=location.hash.match(/^#link=([A-Za-z0-9+/=]+)$/);if(!m)return false;let ok=false;try{const [t,g]=atob(m[1]).split(":");if(t&&g){GH.cfg={token:t,gist:g};ghSave();ok=true}}catch(e){}try{history.replaceState(null,"",location.pathname)}catch(e){location.hash=""}return ok}
function loadQR(){return new Promise((res,rej)=>{if(window.QRCode)return res();const x=document.createElement("script");x.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
async function drawQR(){const el=$("#qr");if(!el)return;try{await loadQR();el.innerHTML="";new QRCode(el,{text:linkUrl(),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.style.background="none";el.style.lineHeight="1.5";el.textContent="QR을 불러오지 못했어요. 인터넷 연결을 확인하거나 연결 주소 복사를 써 주세요."}}
function openLink(){
 ghLoad();
 const tokenUrl="https://github.com/settings/tokens/new?scopes=gist&description="+encodeURIComponent("컷바이컷 기기 연동");
 if(GH.cfg){openSheet("기기 연동",`<p>이 기기는 연동돼 있어요. 작품을 만들거나 고치면 연동한 다른 기기에 20초 안팎으로 나타나요.</p>
  <div class="field"><span class="flabel">폰 연결하기</span><p style="font-size:14px;color:var(--muted)">폰 카메라로 아래 QR을 비추고, 뜨는 주소를 누르면 폰도 바로 연동돼요. 이 QR은 다른 사람에게 보여 주지 마세요.</p><div id="qr" class="qr"></div></div>
  <div class="row"><button class="btn grow" data-act="link-copy">연결 주소 복사</button><button class="btn danger grow" data-act="link-off">이 기기 연동 끊기</button></div>`);drawQR();return}
 openSheet("기기 연동",`<p>컴퓨터에서 한 번만 하면 돼요. 작품을 내 GitHub 계정에 저장할 열쇠를 만들어 넣어요.</p>
  <ol class="steps"><li><a class="btn" href="${tokenUrl}" target="_blank" rel="noopener">GitHub 열쇠 만들기 페이지 열기</a></li><li><b>Expiration</b>을 <b>No expiration</b>으로 바꿔요. 그대로 두면 30일 뒤 연동이 끊겨요.</li><li>맨 아래 초록 버튼 <b>Generate token</b>을 눌러요.</li><li><b>ghp_</b>로 시작하는 글자를 복사해서 아래에 붙여넣어요.</li></ol>
  <div class="field"><label for="gh-t">열쇠 붙여넣기</label><input id="gh-t" class="input" autocomplete="off" spellcheck="false" placeholder="ghp_..."></div><p class="scn-status" id="gh-s" aria-live="polite"></p>`,`<button class="btn solid grow" data-act="link-on">연결</button>`);
}
Object.assign(A,{
 link(){while(sheetStack.length)closeSheet();openLink()},
 async "link-on"(el){const t=$("#gh-t").value.trim(),st=$("#gh-s");if(!/^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(t)){st.textContent="ghp_로 시작하는 열쇠를 빠짐없이 붙여넣어 주세요.";return}
  el.disabled=true;st.textContent="연결하는 중이에요.";
  try{const gist=await ghFindOrCreate(t);GH.cfg={token:t,gist};ghSave();S.synced={};saveLocal();closeSheet();startGh();openLink();toast("기기 연동을 켰어요.")}
  catch(e){el.disabled=false;st.textContent=e&&e.code==="auth"?"열쇠가 맞지 않아요. 다시 복사해서 붙여넣어 주세요.":e&&e.code==="gone"?"이 열쇠로는 저장할 수 없어요. 열쇠를 만들 때 gist 칸에 체크돼 있는지 확인해 주세요.":"연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."}},
 async "link-copy"(){const u=linkUrl();try{await navigator.clipboard.writeText(u);toast("연결 주소를 복사했어요. 폰 크롬 주소창에 붙여넣어 열면 돼요.")}catch(e){copyText(u)}},
 "link-off"(){stopGh();GH.cfg=null;ghSave();S.synced={};saveLocal();Sync.state="local";closeSheet();refreshSync();toast("이 기기의 연동을 끊었어요. 작품은 이 기기에 남아 있어요.")}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&GH.cb)ghPoll()});
window.addEventListener("focus",()=>{if(GH.cb)ghPoll()});
window.addEventListener("online",()=>{if(GH.cb){GH.lastWrite=0;ghPoll()}});
window.addEventListener("offline",()=>{if(GH.cb){Sync.state="retry";refreshSync()}});

/* ───────── 휴지통 ───────── */
const TRASH_DAYS=30;
function setTrash(p,t){if(t)p.trashed=t;else delete p.trashed;if(p.example){saveLocal();return}touch(p)}
function purgeP(id){const p=S.projects[id];if(!p)return;const used=new Set();Object.values(S.projects).forEach(q=>{if(q.id!==id)allCuts(q).forEach(x=>{if(x.c.img)used.add(x.c.img)})});allCuts(p).forEach(x=>{if(x.c.img&&!used.has(x.c.img))imgDel(x.c.img)});delete S.projects[id];saveLocal();if(!p.example)delRemote(id)}
function purgeOld(){const lim=Date.now()-TRASH_DAYS*864e5;Object.values(S.projects).forEach(p=>{if(p.trashed&&p.trashed<lim)purgeP(p.id)})}
function openTrash(){
 purgeOld();const l=Object.values(S.projects).filter(p=>p.trashed).sort((a,b)=>b.trashed-a.trashed);
 if(!l.length){toast("휴지통이 비어 있어요.");return}
 openSheet("휴지통",`<p style="color:var(--muted);font-size:14px">지운 작품은 ${TRASH_DAYS}일 동안 여기 있다가 자동으로 지워져요.</p><div class="dict">${l.map(p=>{const left=Math.max(1,Math.ceil((p.trashed+TRASH_DAYS*864e5-Date.now())/864e5));return `<div class="ditem trow"><div style="min-width:0;flex:1"><h3>${esc(p.name)}</h3><p>씬 ${p.scenes.length}개, 컷 ${allCuts(p).length}개 · ${left}일 뒤 완전히 삭제</p></div><div class="row" style="flex:none"><button class="btn" data-act="trash-back" data-id="${esc(p.id)}">되살리기</button><button class="btn danger" data-act="trash-kill" data-id="${esc(p.id)}">완전 삭제</button></div></div>`}).join("")}</div>`,`<button class="btn danger grow" data-act="trash-empty">휴지통 비우기</button>`);
}

/* ───────── 시작 ───────── */
function routeFromHash(){const h=location.hash.slice(1);if(h.startsWith("p-")&&S.projects[h.slice(2)]){View.pid=h.slice(2)}else if(!h)View.pid=null}
loadLocal();
if(!S.prefs.seeded){S.prefs.seeded=true;const e=normP(exampleProject());S.projects[e.id]=e;saveLocal()}
const justLinked=BUILD==="web"&&consumeLink();
routeFromHash();
render();
if(BUILD==="web"){ghLoad();if(GH.cfg){startGh();if(justLinked)toast("이 기기를 연동했어요. 작품을 불러오는 중이에요.")}}
window.addEventListener("hashchange",()=>{if(sheetStack.length)return;routeFromHash();render()});
setInterval(()=>{if(View.pid&&!sheetStack.length&&!document.activeElement.matches?.("input,textarea")&&!document.querySelector(".dragging")){const t=document.querySelector(".prog-t");if(t){const st=stats(cur());const spans=t.querySelectorAll("span");if(spans[1])spans[1].innerHTML=`남은 ${st.remain}컷, 약 <b>${minLabel(st.remMin)}</b>${st.remain?` · ${clock(Date.now()+st.remMin*60000)} 종료 예상`:""}`}}},30000);
initSync();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
